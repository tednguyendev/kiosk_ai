<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kopitiam AI Concierge — Azure Avatar</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f5f5f0; overflow: hidden; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    window.__CONFIG = {
      AZURE_SPEECH_KEY: '',       // Azure Speech resource key
      AZURE_SPEECH_REGION: '',    // e.g. 'westus2', 'southeastasia'
      GEMINI_API_KEY: '',
      OPENAI_API_KEY: '',
    };

    const GEMINI_MODEL = 'gemini-2.0-flash-exp';
    const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`;
    const WHITE = '#fff';
    const DARK = '#1a1a1a';

    const BRANDS = [
      { name: 'Kopi Kiosk', cuisine: 'Drinks & Desserts', stall: 1, halal: false, tags: ['beverages','dessert','local'] },
      { name: 'Ann Chin Popiah', cuisine: 'Popiah (Michelin Guide)', stall: 1, halal: false, tags: ['local','heritage'] },
      { name: 'Bread Junction', cuisine: 'Bread & Bakery', stall: 2, halal: true, tags: ['baked','halal'] },
      { name: 'Kallang Airport Wanton Mee', cuisine: 'Wanton Noodle', stall: 3, halal: false, tags: ['noodle','local'] },
      { name: 'Teochew Pig Organ Soup', cuisine: 'Teochew Cuisine', stall: 4, halal: false, tags: ['soup','local'] },
      { name: 'Yuan Wei Su Yu', cuisine: 'Vegetarian', stall: 5, halal: true, tags: ['vegetarian','healthy'] },
      { name: 'Ying Jia Steamed Fish', cuisine: 'Steamed Fish', stall: 6, halal: false, tags: ['seafood','healthy'] },
      { name: 'Xiang Chi Mian', cuisine: 'Bak Chor Mee', stall: 7, halal: false, tags: ['noodle','local'] },
      { name: 'He Jia Econ Rice', cuisine: 'Economical Rice', stall: 8, halal: false, tags: ['rice','variety'] },
      { name: 'Yuan Wei Thai Cuisine', cuisine: 'Thai', stall: 9, halal: false, tags: ['spicy','thai'] },
      { name: 'Bu Tang Wang Pepper Soup', cuisine: 'Pepper Soup', stall: 10, halal: false, tags: ['soup','healthy'] },
      { name: 'King Grouper Fish Soup', cuisine: 'Fish Soup', stall: 11, halal: false, tags: ['seafood','soup'] },
      { name: 'Chinatown HK Roast', cuisine: 'HK Roast Meat', stall: 12, halal: false, tags: ['roast','cantonese'] },
      { name: 'Kakak Handmade Noodles', cuisine: 'Ban Mian', stall: 13, halal: true, tags: ['noodle','halal'] },
      { name: 'Cinta Hainanese Chicken Rice', cuisine: 'Chicken Rice', stall: 14, halal: true, tags: ['rice','halal'] },
      { name: 'Monster Chili Mala Hot Pot', cuisine: 'Mala Hotpot', stall: 15, halal: true, tags: ['spicy','halal'] },
      { name: 'Beradik Western', cuisine: 'Western Food', stall: 16, halal: true, tags: ['western','halal'] },
      { name: 'Pak Lum Local Delights', cuisine: 'Local Hawker', stall: 17, halal: true, tags: ['local','halal'] },
      { name: 'Kim Dae Bak Korean & Japanese', cuisine: 'Korean & Japanese', stall: 18, halal: true, tags: ['korean','japanese','halal'] },
      { name: 'Majulah Nasi Padang', cuisine: 'Nasi Padang', stall: 19, halal: true, tags: ['rice','halal'] },
      { name: 'Y&H Ayam Penyet', cuisine: 'Ayam Penyet', stall: 20, halal: true, tags: ['indonesian','halal'] },
      { name: 'Ampang YTF & Tangkak Beef Noodle', cuisine: 'Yong Tau Foo & Beef Noodle', stall: 21, halal: true, tags: ['noodle','halal'] },
    ];

    const FILTERED_WORDS = ['fuck','shit','damn','bitch','asshole'];
    function filterMessage(text) {
      const lower = text.toLowerCase();
      for (const w of FILTERED_WORDS) if (lower.includes(w)) return { allowed: false, reason: "Let's keep the conversation friendly." };
      return { allowed: true };
    }
    function parseFiltersFromText(text) {
      const lower = text.toLowerCase();
      const result = {};
      if (/(halal|muslim|no pork|no lard)/.test(lower)) result.halal = 'halal';
      if (/(non-halal|pork|lard|bacon)/.test(lower) && !result.halal) result.halal = 'non-halal';
      if (/(chinese|mandarin|华文|中文)/.test(lower)) result.language = 'zh';
      return result;
    }

    async function transcribeAudio(audioBlob) {
      const formData = new FormData();
      formData.append('file', audioBlob, 'audio.webm');
      formData.append('model', 'whisper-1');
      formData.append('language', 'en');
      const res = await fetch('https://api.openai.com/v1/audio/transcriptions', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${window.__CONFIG.OPENAI_API_KEY}` },
        body: formData
      });
      const data = await res.json();
      return data.text || '';
    }

    function buildSystemPrompt(activeFilters) {
      let prompt = "You are Kimberly, an AI concierge at Kopitiam Food Court at Tan Tock Seng Hospital (TTSH) in Singapore. You help visitors decide what to eat from 21 stalls.\n\n";
      prompt += "Rules:\n";
      prompt += "1. Recommend exactly ONE stall + ONE specific dish.\n";
      prompt += "2. Mention the stall number clearly (e.g., 'Stall 5').\n";
      prompt += "3. If the user mentions pork/lard, NEVER say it's halal.\n";
      prompt += "4. Keep responses to 4-6 sentences.\n";
      prompt += "5. Use plain text only — no markdown, no bullet points, no asterisks.\n";
      prompt += "6. If the user seems unwell (gastric, flu), suggest gentle options like porridge or vegetarian.\n";
      if (activeFilters.halal === 'halal') prompt += "7. ONLY recommend halal-certified or Muslim-friendly stalls.\n";
      if (activeFilters.language === 'zh') prompt += "\n\nIMPORTANT: Respond entirely in Chinese (中文). Use natural, conversational Chinese. Always mention stall numbers (e.g., '第5档').";
      return prompt;
    }

    async function callGemini(conversationHistory, activeFilters) {
      const url = `${GEMINI_URL}?key=${window.__CONFIG.GEMINI_API_KEY}`;
      const contents = conversationHistory.map(msg => ({
        role: msg.role === 'assistant' ? 'model' : 'user',
        parts: [{ text: msg.content }]
      }));
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: buildSystemPrompt(activeFilters || { halal: "all", language: "en" }) }] },
          contents,
        })
      });
      if (!res.ok) throw new Error(`Gemini API error: ${res.status}`);
      const data = await res.json();
      const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Sorry, I could not generate a response.';
      return raw.replace(/\*\*/g, '').replace(/\*/g, '').replace(/#{1,6}\s?/g, '').trim();
    }

    const VAD_SPEECH_THRESHOLD = 0.02;
    const VAD_SILENCE_MS = 2000;

    function useVoiceActivity({ enabled, paused, onUtterance, onRejected }) {
      const [isListening, setIsListening] = useState(false);
      const [isSpeaking, setIsSpeaking] = useState(false);
      const [isTranscribing, setIsTranscribing] = useState(false);
      const [supported, setSupported] = useState(true);
      const streamRef = useRef(null);
      const audioCtxRef = useRef(null);
      const analyserRef = useRef(null);
      const rafRef = useRef(null);
      const silenceTimerRef = useRef(null);
      const speakingRef = useRef(false);
      const chunksRef = useRef([]);
      const committedRef = useRef(false);
      const lastPausedRef = useRef(paused);

      useEffect(() => {
        if (!lastPausedRef.current && paused && speakingRef.current) {
          speakingRef.current = false;
          if (silenceTimerRef.current) { clearTimeout(silenceTimerRef.current); silenceTimerRef.current = null; }
          try { if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop()); } catch (e) {}
          streamRef.current = null;
        }
        lastPausedRef.current = paused;
      }, [paused]);

      useEffect(() => {
        if (!enabled || paused) {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          return;
        }
        let cancelled = false;
        async function start() {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({
              audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
            });
            if (cancelled) { stream.getTracks().forEach(t => t.stop()); return; }
            streamRef.current = stream;
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioCtx();
            audioCtxRef.current = ctx;
            const src = ctx.createMediaStreamSource(stream);
            const analyser = ctx.createAnalyser();
            analyser.fftSize = 256;
            src.connect(analyser);
            analyserRef.current = analyser;
            const data = new Uint8Array(analyser.frequencyBinCount);
            setIsListening(true);

            function loop() {
              if (cancelled) return;
              analyser.getByteTimeDomainData(data);
              let sum = 0;
              for (let i = 0; i < data.length; i++) {
                const v = (data[i] - 128) / 128;
                sum += v * v;
              }
              const rms = Math.sqrt(sum / data.length);
              if (rms > VAD_SPEECH_THRESHOLD) {
                if (!speakingRef.current) {
                  speakingRef.current = true;
                  setIsSpeaking(true);
                }
                if (silenceTimerRef.current) { clearTimeout(silenceTimerRef.current); silenceTimerRef.current = null; }
              } else if (speakingRef.current) {
                if (!silenceTimerRef.current) {
                  silenceTimerRef.current = setTimeout(() => {
                    speakingRef.current = false;
                    setIsSpeaking(false);
                    if (!committedRef.current && chunksRef.current.length > 0) {
                      committedRef.current = true;
                      const blob = new Blob(chunksRef.current, { type: 'audio/webm' });
                      chunksRef.current = [];
                      setIsTranscribing(true);
                      transcribeAudio(blob).then(text => {
                        setIsTranscribing(false);
                        committedRef.current = false;
                        if (!text || text.trim().length < 2) { onRejected && onRejected('empty'); }
                        else { onUtterance && onUtterance(text, 'en'); }
                      }).catch(err => {
                        setIsTranscribing(false);
                        committedRef.current = false;
                        onRejected && onRejected('error');
                      });
                    }
                  }, VAD_SILENCE_MS);
                }
              }
              rafRef.current = requestAnimationFrame(loop);
            }
            loop();
            const rec = new MediaRecorder(stream, { mimeType: 'audio/webm' });
            rec.ondataavailable = e => { if (e.data.size > 0) chunksRef.current.push(e.data); };
            rec.start(500);
          } catch (err) {
            console.error('Mic error:', err);
            setSupported(false);
          }
        }
        start();
        return () => {
          cancelled = true;
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          if (silenceTimerRef.current) clearTimeout(silenceTimerRef.current);
          if (audioCtxRef.current) { try { audioCtxRef.current.close(); } catch (e) {} }
          if (streamRef.current) { streamRef.current.getTracks().forEach(t => t.stop()); }
        };
      }, [enabled, paused]);

      return { isListening, isSpeaking, isTranscribing, supported };
    }

    // ─── Azure Avatar Service ───
    async function fetchIceToken(region, key) {
      const res = await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/avatar/relay/token/v1`, {
        headers: { 'Ocp-Apim-Subscription-Key': key }
      });
      return res.json();
    }

    function App() {
      const [started, setStarted] = useState(false);
      const [messages, setMessages] = useState([]);
      const [loading, setLoading] = useState(false);
      const [speaking, setSpeaking] = useState(false);
      const [azureReady, setAzureReady] = useState(false);
      const [azureStatus, setAzureStatus] = useState('');
      const [filtered, setFiltered] = useState(false);
      const [recommendations, setRecommendations] = useState([]);
      const [rejectionNote, setRejectionNote] = useState(null);
      const [activeFilters, setActiveFilters] = useState({ halal: "all", language: "en" });
      const activeFiltersRef = useRef({ halal: "all", language: "en" });
      const peerConnectionRef = useRef(null);
      const azureVideoRef = useRef(null);
      const chatEndRef = useRef(null);
      const userSpokeFirstRef = useRef(false);
      const greetingTimeoutRef = useRef(null);
      const pendingSpeakRef = useRef(null);

      const AZURE_KEY = window.__CONFIG?.AZURE_SPEECH_KEY;
      const AZURE_REGION = window.__CONFIG?.AZURE_SPEECH_REGION;

      function extractRecommendations(text) {
        if (!text) return [];
        const stallMatches = [...text.toLowerCase().matchAll(/stall\s*(\d+)/g)].map(m => parseInt(m[1]));
        const seen = new Set();
        const ordered = stallMatches.filter(s => { if (seen.has(s)) return false; seen.add(s); return true; });
        return ordered.map(s => BRANDS.find(b => b.stall === s)).filter(Boolean);
      }

      function getFilteredBrands(filters) {
        return BRANDS.filter(b => {
          if (filters.halal === "halal" && !b.halal) return false;
          if (filters.halal === "non-halal" && b.halal) return false;
          return true;
        });
      }

      useEffect(() => {
        if (chatEndRef.current) chatEndRef.current.scrollIntoView({ behavior: "smooth" });
      }, [messages, loading]);

      useEffect(() => {
        if (started) setRecommendations(getFilteredBrands(activeFiltersRef.current));
      }, [started]);

      // ── Azure Avatar Connection ──
      useEffect(() => {
        if (!started) return;
        let cancelled = false;
        async function connectAzure() {
          if (!AZURE_KEY || !AZURE_REGION) {
            setAzureStatus('Missing Azure Speech key or region');
            return;
          }
          try {
            setAzureStatus('Fetching ICE token...');
            const ice = await fetchIceToken(AZURE_REGION, AZURE_KEY);
            if (!ice.Urls) throw new Error('Failed to get ICE servers');

            const pc = new RTCPeerConnection({
              iceServers: [{ urls: ice.Urls, username: ice.Username, credential: ice.Password }]
            });
            peerConnectionRef.current = pc;

            pc.ontrack = (event) => {
              if (event.track.kind === 'video' && azureVideoRef.current) {
                azureVideoRef.current.srcObject = event.streams[0];
              }
            };

            pc.addTransceiver('audio', { direction: 'sendrecv' });
            pc.addTransceiver('video', { direction: 'recvonly' });

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            setAzureStatus('Connecting to Azure avatar...');

            // Wait for ICE gathering
            await new Promise(resolve => {
              if (pc.iceGatheringState === 'complete') resolve();
              else {
                const check = () => {
                  if (pc.iceGatheringState === 'complete') { pc.removeEventListener('icegatheringstatechange', check); resolve(); }
                };
                pc.addEventListener('icegatheringstatechange', check);
                setTimeout(() => { pc.removeEventListener('icegatheringstatechange', check); resolve(); }, 3000);
              }
            });

            if (cancelled) return;

            // Connect to Azure avatar
            const avatarRes = await fetch(`https://${AZURE_REGION}.tts.speech.microsoft.com/cognitiveservices/avatar/connect`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Ocp-Apim-Subscription-Key': AZURE_KEY
              },
              body: JSON.stringify({
                sdp: pc.localDescription.sdp,
                avatar_config: {
                  avatar_style: 'graceful-sitting',  // try 'graceful-standing' for full body
                  video_format: 'mp4',
                  video_codec: 'h264',
                  bitrate: 2000000,
                  background_color: '#f5f5f0',
                  transparent_background: false
                },
                synthesizer_config: {
                  voice: 'en-US-JennyNeural',
                  language: 'en-US',
                  rate: '+0%'
                }
              })
            });

            const avatarData = await avatarRes.json();
            if (!avatarRes.ok) throw new Error(avatarData.message || `Azure error ${avatarRes.status}`);

            await pc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: avatarData.sdp }));

            setAzureReady(true);
            setAzureStatus('Connected! Speak to Kimberly...');

          } catch (err) {
            console.error('Azure connect error:', err);
            setAzureStatus('Error: ' + err.message);
          }
        }
        connectAzure();
        return () => {
          cancelled = true;
          if (peerConnectionRef.current) {
            peerConnectionRef.current.close();
            peerConnectionRef.current = null;
          }
        };
      }, [started]);

      // ── Azure speak: send text via WebRTC data channel ──
      async function speakWithAzure(text) {
        const pc = peerConnectionRef.current;
        if (!pc || !azureReady) return;
        setSpeaking(true);
        try {
          // Azure avatar uses the WebRTC audio track to receive text
          // We need to send text via the established connection
          // The actual API uses WebSocket or REST to send text after connection
          const res = await fetch(`https://${AZURE_REGION}.tts.speech.microsoft.com/cognitiveservices/avatar/speak`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Ocp-Apim-Subscription-Key': AZURE_KEY
            },
            body: JSON.stringify({ text })
          });
          if (!res.ok) throw new Error(`Speak error: ${res.status}`);
          const duration = Math.max(2000, text.length * 150);
          setTimeout(() => setSpeaking(false), duration);
        } catch (err) {
          console.error('[Azure] speak error:', err);
          setSpeaking(false);
        }
      }

      const sendToAgentRef = useRef(null);

      const handleUtterance = useCallback((text, detectedLang) => {
        userSpokeFirstRef.current = true;
        if (detectedLang && (detectedLang === 'zh' || detectedLang === 'zh-cn')) {
          const next = { ...activeFiltersRef.current, language: 'zh' };
          setActiveFilters(next);
          activeFiltersRef.current = next;
        }
        if (greetingTimeoutRef.current) { clearTimeout(greetingTimeoutRef.current); greetingTimeoutRef.current = null; }
        if (sendToAgentRef.current) sendToAgentRef.current(text);
      }, []);

      const handleRejected = useCallback((reason) => {
        const isZh = activeFiltersRef.current.language === 'zh';
        const msg = reason === 'error'
          ? (isZh ? '无法连接语音识别 — 请重试？' : "Couldn't reach Whisper — try again?")
          : reason === 'empty'
            ? (isZh ? '没有听清楚 — 请重试？' : "Didn't catch that — try again?")
            : (isZh ? '嗯，没有听清楚 — 请重试？' : "Hmm, didn't catch that — try again?");
        setRejectionNote(msg);
        setTimeout(() => setRejectionNote(null), 3500);
      }, []);

      const { isListening, isSpeaking: userSpeaking, isTranscribing, supported } = useVoiceActivity({
        enabled: started,
        paused: speaking || loading,
        onUtterance: handleUtterance,
        onRejected: handleRejected,
      });

      useEffect(() => {
        if (!userSpeaking) return;
        userSpokeFirstRef.current = true;
        if (greetingTimeoutRef.current) { clearTimeout(greetingTimeoutRef.current); greetingTimeoutRef.current = null; }
      }, [userSpeaking]);

      async function sendToAgent(text) {
        if (!text.trim()) return;
        const check = filterMessage(text);
        const userMsg = { role: 'user', content: text };
        setMessages(prev => [...prev, userMsg]);
        setFiltered(false);
        if (!check.allowed) {
          setMessages(prev => [...prev, { role: 'assistant', content: check.reason, filtered: true }]);
          setFiltered(true);
          return;
        }
        const detected = parseFiltersFromText(text);
        const currentFilters = activeFiltersRef.current;
        const newFilters = { ...currentFilters };
        let filtersChanged = false;
        if (detected.halal) { newFilters.halal = detected.halal; filtersChanged = true; }
        if (detected.language) { newFilters.language = detected.language; filtersChanged = true; }
        if (filtersChanged) {
          setActiveFilters(newFilters);
          activeFiltersRef.current = newFilters;
        }
        setRecommendations([]);
        setLoading(true);
        try {
          const history = [...messages, userMsg].filter(m => !m.filtered);
          const reply = await callGemini(history, newFilters);
          const assistantMsg = { role: 'assistant', content: reply };
          setMessages(prev => [...prev, assistantMsg]);
          const aiRecs = extractRecommendations(reply);
          const filteredResults = getFilteredBrands(newFilters);
          const seen = new Set(aiRecs.map(b => b.stall));
          const merged = [...aiRecs, ...filteredResults.filter(b => !seen.has(b.stall))];
          setRecommendations(merged);
          setLoading(false);
          if (azureReady) {
            speakWithAzure(reply);
          } else {
            pendingSpeakRef.current = reply;
          }
        } catch (err) {
          console.error("Gemini error:", err);
          setMessages(prev => [...prev, { role: 'assistant', content: "Error: " + (err.message || err) }]);
          setLoading(false);
        }
      }

      useEffect(() => { sendToAgentRef.current = sendToAgent; });

      const displayScale = Math.min(window.innerWidth / 2160, window.innerHeight / 3840);

      return (
        <div id="app" style={{ display: "flex", width: "100vw", height: "100vh", background: "#f5f5f0", fontFamily: "'Inter', sans-serif", overflow: "hidden" }}>
          <div style={{ transform: `scale(${displayScale})`, transformOrigin: "top left", width: 2160, height: 3840, position: "relative", background: "#f5f5f0" }}>
            {!started && (
              <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", background: "rgba(0,0,0,0.6)", zIndex: 50 }}>
                <h1 style={{ color: "#fff", fontSize: 96, fontWeight: 700, marginBottom: 40 }}>Welcome to Kopitiam</h1>
                <p style={{ color: "#ddd", fontSize: 48, marginBottom: 80 }}>Tap to start your AI concierge experience</p>
                <button onClick={() => setStarted(true)} style={{ padding: "40px 120px", fontSize: 56, fontWeight: 600, background: "#c41e3a", color: "#fff", border: "none", borderRadius: 24, cursor: "pointer" }}>Start</button>
              </div>
            )}
            <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: 160, background: "#c41e3a", display: "flex", alignItems: "center", padding: "0 60px", justifyContent: "space-between" }}>
              <h1 style={{ color: "#fff", fontSize: 56, fontWeight: 700 }}>Kopitiam @ TTSH</h1>
              <div style={{ display: "flex", gap: 24 }}>
                <div style={{ background: activeFilters.halal === 'halal' ? '#2d8a3e' : '#fff', color: activeFilters.halal === 'halal' ? '#fff' : '#333', padding: '16px 32px', borderRadius: 12, fontSize: 28, fontWeight: 600 }}>Halal</div>
                <div style={{ background: activeFilters.language === 'zh' ? '#c41e3a' : '#fff', color: activeFilters.language === 'zh' ? '#fff' : '#333', padding: '16px 32px', borderRadius: 12, fontSize: 28, fontWeight: 600 }}>{activeFilters.language === 'zh' ? '中文' : 'EN'}</div>
              </div>
            </div>
            <div style={{ position: "absolute", left: 60, top: 200, width: 1100, bottom: 60, display: "flex", flexDirection: "column" }}>
              <div style={{ flex: 1, background: WHITE, borderRadius: 24, padding: 40, overflowY: "auto", marginBottom: 24, boxShadow: "0 4px 24px rgba(0,0,0,0.08)" }}>
                {messages.map((m, i) => (
                  <div key={i} style={{ marginBottom: 24, alignSelf: m.role === 'user' ? 'flex-end' : 'flex-start', maxWidth: '80%' }}>
                    <div style={{ background: m.role === 'user' ? '#c41e3a' : '#f0f0f0', color: m.role === 'user' ? '#fff' : DARK, padding: '20px 28px', borderRadius: 20, fontSize: 32, lineHeight: 1.5, whiteSpace: 'pre-wrap' }}>{m.content}</div>
                    {m.filtered && <span style={{ fontSize: 20, color: '#999', marginTop: 8, display: 'block' }}>(filtered)</span>}
                  </div>
                ))}
                {loading && <div style={{ color: '#999', fontSize: 28, padding: 20 }}>Kimberly is thinking...</div>}
                <div ref={chatEndRef} />
              </div>
              <div style={{ height: 420, background: WHITE, borderRadius: 24, padding: 32, overflowX: "auto", display: "flex", gap: 24, boxShadow: "0 4px 24px rgba(0,0,0,0.08)" }}>
                {recommendations.map((b, i) => (
                  <div key={i} style={{ minWidth: 320, background: b.halal ? '#e8f5e9' : '#fff3e0', borderRadius: 20, padding: 28, border: `3px solid ${b.halal ? '#2d8a3e' : '#ff9800'}`, display: "flex", flexDirection: "column" }}>
                    <div style={{ fontSize: 18, color: '#666', marginBottom: 8 }}>Stall {b.stall}</div>
                    <div style={{ fontSize: 28, fontWeight: 700, color: DARK, marginBottom: 8 }}>{b.name}</div>
                    <div style={{ fontSize: 22, color: '#666' }}>{b.cuisine}</div>
                    {b.halal && <div style={{ marginTop: 'auto', fontSize: 18, color: '#2d8a3e', fontWeight: 600 }}>✓ Halal-friendly</div>}
                  </div>
                ))}
              </div>
            </div>
            <div style={{ position: "absolute", right: 60, top: 200, width: 920, bottom: 60, display: "flex", flexDirection: "column" }}>
              <div style={{ flex: 1, background: "#000", borderRadius: 24, overflow: "hidden", position: "relative", boxShadow: "0 4px 24px rgba(0,0,0,0.15)" }}>
                <video ref={azureVideoRef} autoPlay playsInline muted
                  style={{ width: "100%", height: "100%", objectFit: "contain" }}
                />
                {!azureReady && started && (
                  <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", color: "#fff", background: "rgba(0,0,0,0.7)" }}>
                    <div style={{ fontSize: 48, marginBottom: 24 }}>🎭</div>
                    <div style={{ fontSize: 36, fontWeight: 600, marginBottom: 16 }}>{azureStatus || 'Initializing...'}</div>
                    <div style={{ fontSize: 24, color: '#aaa', textAlign: 'center', padding: '0 40px' }}>
                      Paste your Azure Speech key and region in the config at the top of this file
                    </div>
                  </div>
                )}
                {speaking && (
                  <div style={{ position: "absolute", bottom: 40, left: "50%", transform: "translateX(-50%)", background: "rgba(196,30,58,0.9)", color: "#fff", padding: "16px 40px", borderRadius: 40, fontSize: 28, fontWeight: 600 }}>Kimberly is speaking...</div>
                )}
              </div>
              <div style={{ marginTop: 16, display: "flex", gap: 16, alignItems: "center" }}>
                <div style={{ flex: 1, height: 8, background: "#e0e0e0", borderRadius: 4, overflow: "hidden" }}>
                  <div style={{ height: "100%", width: isListening ? "100%" : "0%", background: isSpeaking ? "#c41e3a" : "#2d8a3e", transition: "width 0.2s" }} />
                </div>
                <div style={{ fontSize: 24, color: "#666", minWidth: 180, textAlign: "right" }}>
                  {isTranscribing ? 'Transcribing...' : isSpeaking ? 'Listening...' : isListening ? 'Ready' : 'Mic off'}
                </div>
              </div>
            </div>
            {rejectionNote && (
              <div style={{ position: "absolute", bottom: 80, left: "50%", transform: "translateX(-50%)", background: "#333", color: "#fff", padding: "24px 48px", borderRadius: 16, fontSize: 28, zIndex: 100 }}>{rejectionNote}</div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
