function parseFiltersFromText(text) {
  const lower = text.toLowerCase();
  const filters = {};
  if (/\bhalal\b/.test(lower)) filters.halal = "halal";
  else if (/\b(non[- ]?halal|not halal|no halal)\b/.test(lower)) filters.halal = "non-halal";
  // Language detection
  if (/[\u4e00-\u9fff]/.test(text) || /\b(chinese|zhongwen|中文|华文|华语|普通话)\b/.test(lower)) {
    filters.language = "zh";
  } else if (/\b(english|英文|英语)\b/.test(lower)) {
    filters.language = "en";
  }
  return filters;
}

function buildSystemPrompt(activeFilters) {

When recommending, always mention the stall number (e.g. "Stall 5").

For health-related requests (gastric, sore throat, flu, post-surgery), recommend light and gentle options like porridge (Stall 8), vegetarian (Stall 5), or soup (Stall 10/11). Avoid heavy or rich dishes like organ meats.

Be friendly, warm, and conversational. Always respond in 4-6 sentences — never fewer than 4.
Reply in plain text only. Do not use markdown, asterisks, bold, italics, bullet points, or any formatting symbols — the text is spoken aloud.`;

// ─── Perf timing (pipeline benchmarking) ───
// Each turn populates these timestamps so we can print a breakdown.
const perf = { speechStart: 0, silenceAt: 0, whisperStart: 0, whisperEnd: 0, geminiStart: 0, geminiEnd: 0, speakCall: 0, speakStart: 0, speakEnd: 0 };
const ms = (a, b) => (b - a).toFixed(0) + 'ms';
function perfReset() {
  Object.keys(perf).forEach(k => perf[k] = 0);
}
function perfLogTurn() {
  const { speechStart, silenceAt, whisperStart, whisperEnd, geminiStart, geminiEnd, speakCall, speakStart } = perf;
  const rows = [];
  if (speechStart && silenceAt) rows.push(['User speech duration', ms(speechStart, silenceAt)]);
  if (silenceAt && whisperStart) rows.push(['Silence→Whisper start', ms(silenceAt, whisperStart)]);
  if (whisperStart && whisperEnd) rows.push(['Whisper transcription', ms(whisperStart, whisperEnd)]);
  if (whisperEnd && geminiStart) rows.push(['Whisper→Gemini start', ms(whisperEnd, geminiStart)]);
  if (geminiStart && geminiEnd) rows.push(['Gemini reply', ms(geminiStart, geminiEnd)]);
  if (geminiEnd && speakCall) rows.push(['Gemini→speak() call', ms(geminiEnd, speakCall)]);
  if (speakCall && speakStart) rows.push(['D-ID speak→audio start', ms(speakCall, speakStart)]);
  if (silenceAt && speakStart) rows.push(['TOTAL: silence→Kimberly speaks', ms(silenceAt, speakStart)]);
  console.log('%c[PERF] Turn breakdown', 'font-weight:bold;color:#CF463A');
  console.table(rows);
}

// ─── Whisper + VAD (always-listening) ───

async function transcribeAudio(audioBlob) {
  const OPENAI_API_KEY = window.__CONFIG.OPENAI_API_KEY;
  const formData = new FormData();
  formData.append('file', audioBlob, 'audio.webm');
  formData.append('model', 'whisper-1');
  // language auto-detected by Whisper — supports English, Chinese, etc.
  formData.append('temperature', '0');    // deterministic, reduces invented text
  formData.append('prompt', 'Food court customer asking about stalls, dishes, halal options.');
  formData.append('response_format', 'verbose_json'); // need segments for confidence scoring

  console.log('[Whisper] sending blob, size:', audioBlob.size, 'type:', audioBlob.type);
  perf.whisperStart = performance.now();
  const res = await fetch('https://api.openai.com/v1/audio/transcriptions', {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${OPENAI_API_KEY}` },
    body: formData,
  });

  const raw = await res.text();
  perf.whisperEnd = performance.now();
  console.log('[PERF] Whisper:', ms(perf.whisperStart, perf.whisperEnd));
  console.log('[Whisper] status:', res.status, 'body:', raw);
  if (!res.ok) throw new Error(`Whisper ${res.status}: ${raw}`);
  let data;
  try { data = JSON.parse(raw); } catch { throw new Error('Whisper bad JSON: ' + raw); }
  const segments = data.segments || [];
  const noSpeechProb = segments.length
    ? Math.max(...segments.map(s => s.no_speech_prob ?? 0))
    : 0;
  const avgLogprob = segments.length
    ? Math.min(...segments.map(s => s.avg_logprob ?? 0))
    : 0;
  return {
    text: (data.text || '').trim(),
    language: data.language || 'en',
    noSpeechProb,
    avgLogprob,
  };
}

// Whisper confidence thresholds — flag hallucinations Whisper itself is unsure about.
// no_speech_prob > 0.6: Whisper thinks this segment was actually silence.
// avg_logprob < -1.0: low per-token confidence, usually noise-to-text guesses.
const WHISPER_NO_SPEECH_THRESHOLD = 0.6;
const WHISPER_LOGPROB_THRESHOLD = -1.0;

// Known Whisper hallucinations. Substring match (normalized) — Whisper often concatenates these into longer sentences.
const WHISPER_HALLUCINATION_SUBSTRINGS = [
  'thanks for watching', 'thank you for watching',
  'subscribe to the channel', 'please subscribe', 'like and subscribe',
  'dont forget to like', 'dont forget to subscribe',
  'see you next time', 'see you in the next video',
  'hit the bell', 'ring the bell',
  'pissedconsumer', 'please see review', 'review no',
];
const WHISPER_HALLUCINATION_EXACT = [
  'you', 'thank you', 'thanks', 'bye', 'okay', 'ok',
  '.', '...', 'music', '[music]', '(music)', 'applause', '[applause]',
];
function isHallucination(text, detectedLang) {
  if (!text) return true;
  // Allow Chinese / non-ASCII if Whisper detected Chinese
  const isChinese = detectedLang === 'zh' || detectedLang === 'zh-cn' || detectedLang === 'zh-tw' || /[\u4e00-\u9fff]/.test(text);
  if (isChinese) {
    if (text.trim().length === 0) return true;
    if (/\b(?:https?:\/\/|www\.|\.com|\.org|\.net|\.io)\b/i.test(text)) return true;
    return false;
  }
  const norm = text.toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
  if (norm.length < 2) return true;
  if (WHISPER_HALLUCINATION_EXACT.includes(norm)) return true;
  if (WHISPER_HALLUCINATION_SUBSTRINGS.some(sub => norm.includes(sub))) return true;
  // URLs or domain names — food-court customers don't say these aloud
  if (/\b(?:https?:\/\/|www\.|\.com|\.org|\.net|\.io)\b/i.test(text)) return true;
  // Non-ASCII in English context = likely hallucination
  if (/[^\x00-\x7F]/.test(text)) return true;
  return false;
}

// VAD tuning
const VAD_SPEECH_THRESHOLD = 0.02;    // RMS above this = speaking (lower = catches quieter speakers)
const VAD_SILENCE_MS = 2000;          // silence duration that ends an utterance
const VAD_MIN_SPEECH_MS = 500;        // ignore blips shorter than this
const VAD_MIN_LOUD_FRAMES = 8;        // need at least N loud samples total before committing

function useVoiceActivity({ enabled, paused, onUtterance, onRejected }) {
  const [isListening, setIsListening] = useState(false); // has mic permission / stream running
  const [isSpeaking, setIsSpeaking] = useState(false);   // currently detecting voice
  const [isTranscribing, setIsTranscribing] = useState(false); // VAD committed, Whisper running
  const [supported, setSupported] = useState(true);
  const onRejectedRef = useRef(onRejected);
  useEffect(() => { onRejectedRef.current = onRejected; }, [onRejected]);

  const streamRef = useRef(null);
  const audioCtxRef = useRef(null);
  const analyserRef = useRef(null);
  const rafRef = useRef(null);
  const recorderRef = useRef(null);
  const chunksRef = useRef([]);
  const speakingRef = useRef(false);
  const speechStartRef = useRef(0);
  const lastVoiceAtRef = useRef(0);
  const loudFramesRef = useRef(0);
  const pausedRef = useRef(paused);
  const committedRef = useRef(false); // frozen after an utterance is sent, until Kimberly finishes
  const prevPausedRef = useRef(paused);
  const onUtteranceRef = useRef(onUtterance);

  useEffect(() => { pausedRef.current = paused; }, [paused]);
  useEffect(() => { onUtteranceRef.current = onUtterance; }, [onUtterance]);

  // When the parent stops being busy (Kimberly done speaking + not loading), thaw the mic
  useEffect(() => {
    if (prevPausedRef.current && !paused) {
      committedRef.current = false;
      console.log('[VAD] thaw — ready to listen');
    }
    prevPausedRef.current = paused;
  }, [paused]);

  // If paused mid-utterance, drop in-progress recording so avatar's voice isn't captured
  useEffect(() => {
    if (paused && speakingRef.current) {
      speakingRef.current = false;
      setIsSpeaking(false);
      if (recorderRef.current && recorderRef.current.state === 'recording') {
        recorderRef.current._discard = true;
        try { recorderRef.current.stop(); } catch (e) {}
      }
    }
  }, [paused]);

  useEffect(() => {
    if (!enabled) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setSupported(false);
      return;
    }
    let cancelled = false;

    async function start() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });
        if (cancelled) { stream.getTracks().forEach(t => t.stop()); return; }
        streamRef.current = stream;

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        audioCtxRef.current = ctx;
        const source = ctx.createMediaStreamSource(stream);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 1024;
        source.connect(analyser);
        analyserRef.current = analyser;

        const data = new Uint8Array(analyser.fftSize);
        setIsListening(true);

        const tick = () => {
          rafRef.current = requestAnimationFrame(tick);
          if (pausedRef.current || committedRef.current) return;

          analyser.getByteTimeDomainData(data);
          let sum = 0;
          for (let i = 0; i < data.length; i++) {
            const v = (data[i] - 128) / 128;
            sum += v * v;
          }
          const rms = Math.sqrt(sum / data.length);
          const now = performance.now();

          if (rms > VAD_SPEECH_THRESHOLD) {
            lastVoiceAtRef.current = now;
            loudFramesRef.current += 1;
            if (!speakingRef.current) {
              speakingRef.current = true;
              speechStartRef.current = now;
              setIsSpeaking(true);
              perfReset();
              perf.speechStart = performance.now();
              console.log('[PERF] speech start');
              startRecording();
            }
          } else if (speakingRef.current) {
            const silentFor = now - lastVoiceAtRef.current;
            const spokeFor = now - speechStartRef.current;
            if (silentFor > VAD_SILENCE_MS) {
              speakingRef.current = false;
              setIsSpeaking(false);
              const keep = spokeFor >= VAD_MIN_SPEECH_MS
                        && loudFramesRef.current >= VAD_MIN_LOUD_FRAMES;
              if (keep) {
                committedRef.current = true; // freeze mic until Kimberly replies
                perf.silenceAt = performance.now() - VAD_SILENCE_MS; // when user actually stopped
                console.log('[PERF] silence detected — committing, loudFrames:', loudFramesRef.current, 'spokeFor:', spokeFor.toFixed(0) + 'ms');
              } else {
                console.log('[VAD] discarded — too short/quiet, loudFrames:', loudFramesRef.current, 'spokeFor:', spokeFor);
              }
              loudFramesRef.current = 0;
              stopRecording(keep);
            }
          }
        };
        tick();
      } catch (err) {
        console.error("Mic access error:", err);
        setSupported(false);
      }
    }

    function startRecording() {
      if (!streamRef.current) return;
      if (recorderRef.current && recorderRef.current.state === 'recording') return;
      try {
        const rec = new MediaRecorder(streamRef.current, { mimeType: 'audio/webm' });
        chunksRef.current = [];
        rec.ondataavailable = (e) => { if (e.data.size > 0) chunksRef.current.push(e.data); };
        rec.onstop = async () => {
          const discard = rec._discard === true;
          const blob = new Blob(chunksRef.current, { type: 'audio/webm' });
          chunksRef.current = [];
          if (discard || blob.size === 0) {
            console.log('[VAD] discarded utterance');
            committedRef.current = false;
            setIsTranscribing(false);
            return;
          }
          setIsTranscribing(true);
          try {
            const { text, language, noSpeechProb, avgLogprob } = await transcribeAudio(blob);
            const clean = (text || '').trim();
            const detectedLang = language || 'en';
            console.log('[VAD] Whisper:', JSON.stringify(clean), 'lang:', detectedLang, 'no_speech:', noSpeechProb.toFixed(2), 'logprob:', avgLogprob.toFixed(2));
            const lowConfidence = noSpeechProb > WHISPER_NO_SPEECH_THRESHOLD || avgLogprob < WHISPER_LOGPROB_THRESHOLD;
            if (clean && !isHallucination(clean, detectedLang) && !lowConfidence && onUtteranceRef.current) {
              onUtteranceRef.current(clean, detectedLang);
            } else {
              const reason = !clean ? 'empty' : lowConfidence ? 'low-confidence' : 'hallucination';
              console.log('[VAD] rejected (' + reason + '):', JSON.stringify(clean));
              committedRef.current = false;
              if (onRejectedRef.current) onRejectedRef.current(reason);
            }
          } catch (err) {
            console.error("Whisper error:", err);
            committedRef.current = false;
            if (onRejectedRef.current) onRejectedRef.current('error');
          } finally {
            setIsTranscribing(false);
          }
        };
        recorderRef.current = rec;
        rec.start();
      } catch (e) {
        console.error('Recorder start error', e);
      }
    }

    function stopRecording(keep) {
      const rec = recorderRef.current;
      if (!rec || rec.state !== 'recording') return;
      rec._discard = !keep;
      try { rec.stop(); } catch (e) {}
    }

    start();

    return () => {
      cancelled = true;
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      if (recorderRef.current && recorderRef.current.state === 'recording') {
        recorderRef.current._discard = true;
        try { recorderRef.current.stop(); } catch (e) {}
      }
      if (audioCtxRef.current) { try { audioCtxRef.current.close(); } catch (e) {} }
      if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
      streamRef.current = null;
      setIsListening(false);
      setIsSpeaking(false);
    };
  }, [enabled]);

  return { isListening, isSpeaking, isTranscribing, supported };
}

// ─── Gemini LLM ───

// SYSTEM_PROMPT is now dynamic via buildSystemPrompt(activeFilters)

async function callGemini(conversationHistory, activeFilters) {
  const GEMINI_API_KEY = window.__CONFIG.GEMINI_API_KEY;
  const GEMINI_MODEL = window.__CONFIG.GEMINI_MODEL;
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`;

  const contents = conversationHistory.map(msg => ({
    role: msg.role === 'assistant' ? 'model' : 'user',
    parts: [{ text: msg.content }]
  }));

  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      system_instruction: { parts: [{ text: buildSystemPrompt(activeFilters || { halal: "all", language: "en" }) }] },
      contents,
    })
  });

  if (!res.ok) throw new Error(`Gemini API error: ${res.status}`);
  const data = await res.json();
  const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Sorry, I could not generate a response.';
  // Strip markdown emphasis so D-ID doesn't speak the literal "asterisk asterisk".
  return raw
    .replace(/\*\*(.*?)\*\*/g, '$1')   // **bold**
    .replace(/\*(.*?)\*/g, '$1')       // *italic*
    .replace(/_{1,2}(.*?)_{1,2}/g, '$1') // __bold__ / _italic_
    .replace(/`([^`]+)`/g, '$1')       // `code`
    .replace(/^\s*[-*+]\s+/gm, '')     // bullet list markers
    .replace(/\s{2,}/g, ' ')
    .trim();
}

// ─── App ───

function App() {
  const [started, setStarted] = useState(false);
  const [messages, setMessages] = useState([]);
  const [loading, setLoading] = useState(false);
  const [speaking, setSpeaking] = useState(false);
  const [didConnected, setDidConnected] = useState(false);
  const [videoReady, setVideoReady] = useState(false);
  const [didStatus, setDidStatus] = useState("Initializing...");
  const [filtered, setFiltered] = useState(false);
  const [recommendations, setRecommendations] = useState([]);
  const [rejectionNote, setRejectionNote] = useState(null);
  // ── Filter state (bidirectional sync with AI) ──
  const [activeFilters, setActiveFilters] = useState({ halal: "all", language: "en" });
  const activeFiltersRef = useRef({ halal: "all", language: "en" });
  const videoRef = useRef(null);
  const agentRef = useRef(null);
  const chatEndRef = useRef(null);
  const userSpokeFirstRef = useRef(false);
  const greetingTimeoutRef = useRef(null);
  const pendingSpeakRef = useRef(null);
  // Mirror didConnected into a ref so sendToAgent doesn't read a stale value from its closure
  // when Gemini returns after D-ID finishes connecting (race condition: otherwise pendingSpeakRef is set
  // but the 'connected' event already fired with nothing to speak, leaving the UI stuck loading).
  const didConnectedRef = useRef(false);
  // When true, the next speak() → 'START'/'speaking' video event is a silent warmup; don't flip App's
  // `speaking` state (which would pause VAD and drop the user's in-progress recording). videoReady still flips.
  const isWarmupRef = useRef(false);

  const D_ID_API_KEY = window.__CONFIG?.D_ID_API_KEY;
  const D_ID_AGENT_ID = window.__CONFIG?.D_ID_AGENT_ID;

  // Extract recommended stalls from AI response (order-preserving, stall numbers only)
  function extractRecommendations(text) {
    if (!text) return [];
    const stallMatches = [...text.toLowerCase().matchAll(/stall\s*(\d+)/g)].map(m => parseInt(m[1]));
    // Deduplicate while preserving order
    const seen = new Set();
    const ordered = stallMatches.filter(s => { if (seen.has(s)) return false; seen.add(s); return true; });
    return ordered.map(s => BRANDS.find(b => b.stall === s)).filter(Boolean);
  }

  // Apply active filters to BRANDS
  function getFilteredBrands(filters) {
    return BRANDS.filter(b => {
      if (filters.halal === "halal" && !b.halal) return false;
      if (filters.halal === "non-halal" && b.halal) return false;
      return true;
    });
  }

  // Auto-scroll chat to bottom
  useEffect(() => {
    if (chatEndRef.current) chatEndRef.current.scrollIntoView({ behavior: "smooth" });
  }, [messages, loading]);

  // Show all stalls on startup so users can browse immediately
  useEffect(() => {
    if (started) {
      setRecommendations(getFilteredBrands(activeFiltersRef.current));
    }
  }, [started]);

  // Connect D-ID only after user clicks Start
  useEffect(() => {
    if (!started) return;
    let cancelled = false;
    async function waitForSDK() {
      if (window.__DID_READY) return;
      return new Promise(resolve => window.addEventListener('did-ready', resolve, { once: true }));
    }
    async function connectDID() {
      await waitForSDK();
      const did = window.__DID;
      if (!did) { setDidStatus("SDK failed to load"); return; }
      try {
        const agent = await did.createAgentManager(D_ID_AGENT_ID, {
          auth: { type: 'basic', token: D_ID_API_KEY },
          callbacks: {
            onSrcObjectReady(srcObject) {
              if (videoRef.current) {
                videoRef.current.srcObject = srcObject;
                videoRef.current.onloadeddata = () => videoRef.current.play().catch(() => {});
                videoRef.current.play().catch(() => {});
              }
            },
            onConnectionStateChange(state) {
              if (cancelled) return;
              setDidStatus(state);
              if (state === 'connected') {
                setDidConnected(true);
                didConnectedRef.current = true;
                if (videoRef.current && videoRef.current.srcObject) {
                  videoRef.current.play().catch(() => {});
                }
                // Warm up the idle stream immediately so the avatar circle isn't blank.
                // D-ID only pushes video frames after the first speak() call.
                if (pendingSpeakRef.current) {
                  const text = pendingSpeakRef.current;
                  pendingSpeakRef.current = null;
                  setTimeout(() => {
                    if (agentRef.current) {
                      perf.speakCall = performance.now();
                      agentRef.current.speak({ type: 'text', input: text }).catch(() => {});
                    }
                    setLoading(false); // pending reply is now being spoken
                  }, 500);
                } else if (!userSpokeFirstRef.current) {
                  greetingTimeoutRef.current = setTimeout(() => {
                    if (agentRef.current && !userSpokeFirstRef.current) {
                      const greetingText = activeFiltersRef.current.language === 'zh'
                        ? '你好！我是Kimberly，Kopitiam的AI礼宾。今天想吃点什么呢？'
                        : 'Hello! I am Kimberly, your AI concierge here at Kopitiam. What are you in the mood for today?';
                      agentRef.current.speak({ type: 'text', input: greetingText }).catch(() => {});
                    }
                  }, 500);
                } else {
                  // User already spoke — fire a muted warmup speak so D-ID pushes video frames.
                  // D-ID minLength is 3 chars, so we must use real text and mute the <video> element
                  // to hide the audio. isWarmupRef prevents VAD from dropping the in-progress recording.
                  isWarmupRef.current = true;
                  console.log('[D-ID] firing silent warmup speak (user spoke first)');
                  if (videoRef.current) videoRef.current.muted = true;
                  setTimeout(() => {
                    if (agentRef.current) {
                      agentRef.current.speak({ type: 'text', input: 'mmm' }).catch(err => {
                        console.error('[D-ID] warmup speak error:', err);
                        isWarmupRef.current = false;
                        if (videoRef.current) videoRef.current.muted = false;
                      });
                    }
                  }, 100);
                }
              }
            },
            onVideoStateChange(state) {
              if (state === 'START' || state === 'speaking') {
                if (!perf.speakStart && perf.speakCall) {
                  perf.speakStart = performance.now();
                  console.log('[PERF] D-ID speak→speaking:', ms(perf.speakCall, perf.speakStart));
                  perfLogTurn();
                }
                setVideoReady(true);
                if (!isWarmupRef.current) setSpeaking(true);
              }
              if (state === 'STOP' || state === 'idle' || state === 'stopped') {
                if (perf.speakStart && !perf.speakEnd) {
                  perf.speakEnd = performance.now();
                  console.log('[PERF] Kimberly speak duration:', ms(perf.speakStart, perf.speakEnd));
                }
                if (isWarmupRef.current) {
                  isWarmupRef.current = false; // warmup done; don't touch `speaking` (was never set true)
                  if (videoRef.current) videoRef.current.muted = false; // restore audio for real replies
                } else {
                  setSpeaking(false);
                }
                if (state === 'idle') setVideoReady(true); // idle loop means real frames are flowing
              }
            },
            onNewMessage(msgs, type) {
              // Messages handled by Gemini directly, not D-ID LLM
            }
          },
          streamOptions: { compatibilityMode: 'auto', streamWarmup: true }
        });
        agentRef.current = agent;
        window.__agentRef = agent;
        console.log('Agent methods:', Object.getOwnPropertyNames(Object.getPrototypeOf(agent)));
        // Test hook: ?delay_did=N stalls D-ID connect by N ms so we can reproduce the speak-first race.
        const delayMs = parseInt(new URLSearchParams(location.search).get('delay_did') || '0', 10);
        if (delayMs > 0) {
          console.log('[TEST] delaying D-ID connect by', delayMs, 'ms');
          await new Promise(r => setTimeout(r, delayMs));
        }
        await agent.connect();
      } catch (err) {
        console.error("D-ID connect error:", err);
        setDidStatus("Error: " + err.message);
      }
    }
    connectDID();

    // Disconnect when tab closes/hides so D-ID session is released server-side
    const handleUnload = () => {
      try { agentRef.current && agentRef.current.disconnect(); } catch (e) {}
      agentRef.current = null;
    };
    window.addEventListener('pagehide', handleUnload);
    window.addEventListener('beforeunload', handleUnload);

    return () => {
      cancelled = true;
      window.removeEventListener('pagehide', handleUnload);
      window.removeEventListener('beforeunload', handleUnload);
      if (agentRef.current) {
        try { agentRef.current.disconnect().catch(() => {}); } catch (e) {}
        agentRef.current = null;
      }
    };
  }, [started]);

  const sendToAgentRef = useRef(null);

  const handleUtterance = useCallback((text, detectedLang) => {
    userSpokeFirstRef.current = true;
    // Auto-detect language from Whisper
    if (detectedLang && (detectedLang === 'zh' || detectedLang === 'zh-cn' || detectedLang === 'zh-tw' || detectedLang === 'cmn')) {
      const next = { ...activeFiltersRef.current, language: 'zh' };
      setActiveFilters(next);
      activeFiltersRef.current = next;
      console.log('[Filters] language auto-detected: zh');
    }
    if (greetingTimeoutRef.current) {
      clearTimeout(greetingTimeoutRef.current);
      greetingTimeoutRef.current = null;
    }
    if (sendToAgentRef.current) sendToAgentRef.current(text);
  }, []);

  const handleRejected = useCallback((reason) => {
    const isZh = activeFiltersRef.current.language === 'zh';
    const msg = reason === 'error'
      ? (isZh ? '无法连接语音识别 — 请重试？' : "Couldn't reach Whisper — try again?")
      : reason === 'empty'
        ? (isZh ? '没有听清楚 — 请重试？' : "Didn't catch that — try again?")
        : (isZh ? '嗯，没有听清楚 — 请重试？' : "Hmm, didn't catch that — try again?");
    setRejectionNote(msg);
    setTimeout(() => setRejectionNote(null), 3500);
  }, []);

  const { isListening, isSpeaking: userSpeaking, isTranscribing, supported } = useVoiceActivity({
    enabled: started,
    paused: speaking || loading,
    onUtterance: handleUtterance,
    onRejected: handleRejected,
  });

  // The moment VAD hears the user talking, cancel any pending/active greeting.
  // This runs immediately (not after Whisper), so the AI won't start its first greeting on top of the user.
  useEffect(() => {
    if (!userSpeaking) return;
    userSpokeFirstRef.current = true;
    if (greetingTimeoutRef.current) {
      clearTimeout(greetingTimeoutRef.current);
      greetingTimeoutRef.current = null;
    }
    // If D-ID already started the greeting, try to stop it (only when it's the greeting, not a real reply)
    if (messages.length === 0 && agentRef.current && speaking) {
      const a = agentRef.current;
      try {
        if (typeof a.interrupt === 'function') a.interrupt();
        else if (typeof a.stopSpeaking === 'function') a.stopSpeaking();
        else if (typeof a.stop === 'function') a.stop();
      } catch (e) { console.log('interrupt failed', e); }
    }
  }, [userSpeaking, speaking, messages.length]);

  async function sendToAgent(text) {
    if (!text.trim()) return;
    const check = filterMessage(text);
    const userMsg = { role: 'user', content: text };
    setMessages(prev => [...prev, userMsg]);
    setFiltered(false);
    if (!check.allowed) {
      setMessages(prev => [...prev, { role: 'assistant', content: check.reason, filtered: true }]);
      setFiltered(true);
      return;
    }

    // ── Auto-detect filters from user voice ──
    const detected = parseFiltersFromText(text);
    const currentFilters = activeFiltersRef.current;
    const newFilters = { ...currentFilters };
    let filtersChanged = false;
    if (detected.halal) { newFilters.halal = detected.halal; filtersChanged = true; }
    if (detected.language) { newFilters.language = detected.language; filtersChanged = true; }
    if (filtersChanged) {
      setActiveFilters(newFilters);
      activeFiltersRef.current = newFilters;
      console.log('[Filters] voice-detected:', JSON.stringify(newFilters));
    }

    setRecommendations([]);
    setLoading(true);
    try {
      // Build conversation history for Gemini
      const history = [...messages, userMsg].filter(m => !m.filtered);
      perf.geminiStart = performance.now();
      const reply = await callGemini(history, newFilters);
      perf.geminiEnd = performance.now();
      console.log('[PERF] Gemini:', ms(perf.geminiStart, perf.geminiEnd));
      const assistantMsg = { role: 'assistant', content: reply };
      setMessages(prev => [...prev, assistantMsg]);
      // AI recommendations + filtered results
      const aiRecs = extractRecommendations(reply);
      const filteredResults = getFilteredBrands(newFilters);
      // Merge: AI recs first, then filtered results that aren't already in AI recs
      const seen = new Set(aiRecs.map(b => b.stall));
      const merged = [...aiRecs, ...filteredResults.filter(b => !seen.has(b.stall))];
      setRecommendations(merged);
      if (agentRef.current && didConnectedRef.current) {
        setLoading(false);
        perf.speakCall = performance.now();
        agentRef.current.speak({ type: 'text', input: reply }).catch(err => {
          console.error("speak error:", err);
        });
      } else {
        console.log('[App] reply queued — waiting for D-ID to connect');
        pendingSpeakRef.current = reply;
      }
    } catch (err) {
      console.error("Gemini error:", err);
      setMessages(prev => [...prev, { role: 'assistant', content: "Error: " + (err.message || err) }]);
      setLoading(false);
    }
  }

  useEffect(() => { sendToAgentRef.current = sendToAgent; });

  // Test hooks for playwright/manual QA — inspect refs and inject utterances without a mic.
  useEffect(() => {
    window.__test = {
      sendToAgent: (text) => sendToAgentRef.current && sendToAgentRef.current(text),
      getState: () => ({
        loading, speaking, didConnected, videoReady,
        userSpokeFirst: userSpokeFirstRef.current,
        pendingSpeak: pendingSpeakRef.current,
        messagesCount: messages.length,
        lastMessage: messages[messages.length - 1],
        perf: { ...perf },
        activeFilters: activeFiltersRef.current,
      }),
      markUserSpokeFirst: () => { userSpokeFirstRef.current = true; },
      // Simulates D-ID's connected event firing — flips state AND ref, like the real onConnectionStateChange
      // would. Use to reproduce the speak-first race without needing a live D-ID session.
      fakeDidConnect: () => { setDidConnected(true); didConnectedRef.current = true; },
    };
  }, [loading, speaking, didConnected, videoReady, messages]);

  // ─── Start Screen ───
  if (!started) {
    return (
      <div style={{
        width: 2160, height: 3840, position: "relative", background: WHITE,
        display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
        backgroundImage: "linear-gradient(0deg, rgba(232,232,232,0.82), rgba(232,232,232,0.82)), url(assets/background.png)",
        backgroundSize: "cover", backgroundPosition: "center",
      }}>
        {/* Logo */}
        <img src="assets/kopitiam-logo.png" alt="Kopitiam" style={{ width: 800, marginBottom: 40 }} onError={(e) => { e.target.style.display = 'none'; }} />
        <div style={{ fontSize: 64, fontWeight: 600, color: "#000", marginBottom: 40 }}>AI CONCIERGE</div>
        <button onClick={() => setStarted(true)} style={{
          padding: "40px 100px", background: RED, color: WHITE,
          border: "none", borderRadius: 30, fontSize: 48, fontWeight: 700,
          cursor: "pointer", boxShadow: "0 4px 40px rgba(207,70,58,0.4)"
        }}>
          Start Conversation
        </button>
        <div style={{ color: "#888", fontSize: 32, marginTop: 30 }}>Tap to begin</div>
      </div>
    );
  }

  // ─── Main Kiosk Screen ───
  return (
    <div style={{
      width: 2160, height: 3840, position: "relative", background: WHITE, overflow: "hidden",
      backgroundImage: "linear-gradient(0deg, rgba(232,232,232,0.82), rgba(232,232,232,0.82)), url(assets/background.png)",
      backgroundSize: "cover", backgroundPosition: "center",
    }}>

      {/* ── Header: Logo + AI CONCIERGE ── */}
      <div style={{ position: "absolute", top: 0, left: 0, width: 2160, textAlign: "center" }}>
        <div style={{
          fontWeight: 500, fontSize: 40, lineHeight: "48px", letterSpacing: "0.2em",
          color: "#000", marginTop: 91,
        }}>WELCOME TO</div>
        <img src="assets/kopitiam-logo.png" alt="Kopitiam" style={{
          width: 1222, height: "auto", margin: "0 auto", display: "block",
        }} onError={(e) => {
          e.target.outerHTML = '<div style="font-size:120px;font-weight:800;color:#CF463A;font-style:italic;margin:20px 0;">KOPITIAM</div>';
        }} />
        <div style={{
          fontWeight: 500, fontSize: 40, lineHeight: "48px", letterSpacing: "0.2em",
          color: "#000", marginTop: 10,
        }}>AI CONCIERGE</div>
      </div>

      {/* ── Left Sidebar Nav ── */}
      <div style={{
        position: "absolute", left: 59, top: 340,
        display: "flex", flexDirection: "column", gap: 29,
      }}>
        <NavButton icon={ICONS.home} label="Home" />
        <NavButton icon={ICONS.seats} label="Seats" />
        <NavButton icon={ICONS.stores} label="Stores" />
        <NavButton icon={ICONS.food} label="Food" />
        <NavButton icon={ICONS.chat} label={<span style={{ fontSize: 36, lineHeight: "40px" }}>Chat with<br/>me</span>} active />
      </div>

      {/* ── Kimberly Avatar (D-ID video, right side) ── */}
      <div style={{
        position: "absolute", width: 900, height: 900,
        left: 1200, top: 440, overflow: "hidden",
        borderRadius: "50%",
        border: `6px solid ${GOLD}`,
        boxShadow: speaking ? `0 0 60px rgba(245,177,80,0.4)` : "0 8px 40px rgba(0,0,0,0.15)",
        transition: "all 0.3s",
      }}>
        <video ref={videoRef} autoPlay playsInline
          onLoadedMetadata={() => { if (videoRef.current) videoRef.current.play().catch(() => {}); }}
          style={{ width: "100%", height: "100%", objectFit: "cover", objectPosition: "center top" }}
        />
        {!videoReady && (
          <div style={{
            position: "absolute", inset: 0, display: "flex", flexDirection: "column",
            alignItems: "center", justifyContent: "center",
            background: "linear-gradient(180deg, #f4e6d0 0%, #e8d4b0 100%)",
          }}>
            {/* Stylized silhouette placeholder so the circle never looks empty */}
            <svg width="320" height="320" viewBox="0 0 200 200" style={{ opacity: 0.35 }}>
              <circle cx="100" cy="75" r="38" fill={RED} />
              <path d="M 30 200 Q 30 115 100 115 Q 170 115 170 200 Z" fill={RED} />
            </svg>
            <div style={{ display: "flex", alignItems: "center", gap: 14, marginTop: 24 }}>
              <div style={{ width: 32, height: 32, border: "3px solid rgba(207,70,58,0.25)", borderTopColor: RED, borderRadius: "50%", animation: "spin 1s linear infinite" }} />
              <span style={{ color: "#7a5a3a", fontSize: 30, fontWeight: 500 }}>
                {didConnected ? "Kimberly is getting ready..." : didStatus}
              </span>
            </div>
          </div>
        )}
      </div>

      {/* ── Chat Area (text message style) ── */}
      <div style={{
        position: "absolute", left: 400, top: 500, width: 750, height: 1150,
        display: "flex", flexDirection: "column",
        background: "transparent", borderRadius: 30,
        padding: 20,
      }}>
        <div style={{
          flex: 1, overflowY: "auto",
          display: "flex", flexDirection: "column", gap: 24,
        }}>
          {/* Initial greeting */}
          {messages.length === 0 && !loading && !userSpeaking && !isTranscribing && (
            <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-start" }}>
              <div style={{ fontWeight: 600, fontSize: 30, color: RED, marginBottom: 8, marginLeft: 8 }}>Kimberly</div>
              <div style={{
                background: "rgba(245, 177, 80, 0.6)",
                borderRadius: "20px 20px 20px 4px",
                padding: "24px 32px", maxWidth: "70%",
                fontSize: 32, lineHeight: "42px", color: "#000",
              }}>
                {activeFilters.language === 'zh'
                  ? '你好！我是Kimberly，陈笃生医院Kopitiam美食阁的AI礼宾。我们有21个美食摊位，包括本地美食和清真选项等。今天想吃点什么呢？'
                  : "Hello! I'm Kimberly, your AI concierge here at Kopitiam, Tan Tock Seng Hospital. We have 21 food stalls with local favourites, halal options, and more. What are you in the mood for?"
                }
              </div>
            </div>
          )}

          {/* Message history */}
          {messages.map((msg, i) => (
            msg.role === 'user' ? (
              <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "flex-end" }}>
                <div style={{ fontWeight: 600, fontSize: 30, color: "#555", marginBottom: 8, marginRight: 8 }}>You</div>
                <div style={{
                  background: RED,
                  borderRadius: "20px 20px 4px 20px",
                  padding: "24px 32px", maxWidth: "70%",
                  fontSize: 32, lineHeight: "42px", color: WHITE,
                }}>
                  {msg.content}
                </div>
              </div>
            ) : (
              <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "flex-start" }}>
                <div style={{ fontWeight: 600, fontSize: 30, color: RED, marginBottom: 8, marginLeft: 8 }}>Kimberly</div>
                <div style={{
                  background: "rgba(245, 177, 80, 0.6)",
                  borderRadius: "20px 20px 20px 4px",
                  padding: "24px 32px", maxWidth: "70%",
                  fontSize: 32, lineHeight: "42px",
                  color: msg.filtered ? RED : "#000",
                }}>
                  {msg.content}
                </div>
              </div>
            )
          ))}

          {/* Listening indicator */}
          {userSpeaking && (
            <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end" }}>
              <div style={{ fontWeight: 600, fontSize: 30, color: "#555", marginBottom: 8, marginRight: 8 }}>You</div>
              <div style={{
                background: "rgba(207,70,58,0.15)",
                borderRadius: "20px 20px 4px 20px",
                padding: "24px 32px", maxWidth: "70%",
                fontSize: 32, lineHeight: "42px", color: RED,
                border: `2px dashed ${RED}`,
              }}>
                {activeFilters.language === 'zh' ? '正在聆听...' : 'Listening...'}
              </div>
            </div>
          )}

          {/* Transcribing indicator — bridges the gap between VAD cutoff and user bubble appearing */}
          {isTranscribing && !userSpeaking && (
            <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end" }}>
              <div style={{ fontWeight: 600, fontSize: 30, color: "#555", marginBottom: 8, marginRight: 8 }}>You</div>
              <div style={{
                background: "rgba(207,70,58,0.08)",
                borderRadius: "20px 20px 4px 20px",
                padding: "24px 32px",
                fontSize: 32, lineHeight: "42px", color: "#888",
                border: `2px dashed #bbb`,
              }}>
                <span style={{ animation: "pulse 1.5s infinite" }}>{activeFilters.language === 'zh' ? '正在转录...' : 'Transcribing...'}</span>
              </div>
            </div>
          )}

          {/* Loading indicator */}
          {loading && (
            <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-start" }}>
              <div style={{ fontWeight: 600, fontSize: 30, color: RED, marginBottom: 8, marginLeft: 8 }}>Kimberly</div>
              <div style={{
                background: "rgba(245, 177, 80, 0.3)",
                borderRadius: "20px 20px 20px 4px",
                padding: "24px 32px",
                fontSize: 32, lineHeight: "42px", color: "#666",
              }}>
                <span style={{ animation: "pulse 1.5s infinite" }}>
                  {activeFilters.language === 'zh'
                    ? (didConnected ? '正在思考...' : '正在思考... (连接虚拟形象)')
                    : (didConnected ? "Thinking..." : "Thinking... (connecting avatar)")
                  }
                </span>
              </div>
            </div>
          )}

          {/* Transient rejection toast — shown when Whisper returns nothing useful */}
          {rejectionNote && !loading && !userSpeaking && !isTranscribing && (
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
              <div style={{
                background: "rgba(207,70,58,0.08)",
                borderRadius: 30,
                padding: "16px 28px",
                fontSize: 28, color: "#888",
                border: `2px solid rgba(207,70,58,0.2)`,
              }}>
                {rejectionNote}
              </div>
            </div>
          )}

          <div ref={chatEndRef} />
        </div>
      </div>

      {/* ── Voice status indicator ── */}
      <div style={{
        position: "absolute", left: "50%", top: 1830,
        transform: "translateX(-50%)",
        display: "flex", flexDirection: "column", alignItems: "center", gap: 16,
      }}>
        <div style={{
          display: "flex", alignItems: "center", gap: 20,
          padding: "24px 48px", borderRadius: 60,
          background: WHITE,
          border: `4px solid ${userSpeaking ? RED : (speaking || loading) ? "#ccc" : GOLD}`,
          boxShadow: "0 4px 20px rgba(0,0,0,0.08)",
          transition: "all 0.3s",
        }}>
          <div style={{
            width: 28, height: 28, borderRadius: "50%",
            background: userSpeaking ? RED : (speaking || loading) ? "#ccc" : "#4CAF50",
            animation: userSpeaking ? "pulse 1s infinite" : "none",
          }} />
          <span style={{
            fontSize: 36, fontWeight: 600,
            color: userSpeaking ? RED : (speaking || loading) ? "#888" : DARK_TEXT,
          }}>
            {!isListening
              ? (activeFilters.language === 'zh' ? '启动麦克风…' : 'Starting mic…')
              : speaking
                ? (activeFilters.language === 'zh' ? 'Kimberly正在说话…' : 'Kimberly is speaking…')
                : loading
                  ? (activeFilters.language === 'zh' ? '正在思考…' : 'Thinking…')
                  : userSpeaking
                    ? (activeFilters.language === 'zh' ? '正在聆听…' : 'Listening…')
                    : (activeFilters.language === 'zh' ? '请说话 — 我在听' : "Just speak — I'm listening")
            }
          </span>
        </div>
        {!didConnected && (
          <div style={{ color: "#888", fontSize: 28 }}>{didStatus}</div>
        )}
      </div>


      {/* ── Filter Bar ── */}
      <div style={{
        position: "absolute", left: 400, top: 370, width: 750,
        padding: "0",
        display: "flex", flexDirection: "column", gap: 12,
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 20, flexWrap: "wrap" }}>
          <span style={{ fontSize: 32, fontWeight: 600, color: DARK_TEXT }}>{activeFilters.language === 'zh' ? '筛选:' : 'Filters:'}</span>

          {/* Halal filter */}
          {[
            { key: "all", label: activeFilters.language === 'zh' ? '全部' : 'All' },
            { key: "halal", label: activeFilters.language === 'zh' ? '清真' : 'Halal' },
            { key: "non-halal", label: activeFilters.language === 'zh' ? '非清真' : 'Non-Halal' },
          ].map(opt => (
            <button key={opt.key} onClick={() => {
              const next = { ...activeFiltersRef.current, halal: opt.key };
              setActiveFilters(next);
              activeFiltersRef.current = next;
              // Refresh displayed stalls immediately
              const filtered = getFilteredBrands(next);
              const aiRecs = recommendations.filter(r => {
                const match = filtered.find(f => f.stall === r.stall);
                return !!match;
              });
              setRecommendations([...aiRecs, ...filtered.filter(f => !aiRecs.find(r => r.stall === f.stall))]);
            }} style={{
              padding: "12px 28px", borderRadius: 30, fontSize: 28, fontWeight: 600,
              border: `3px solid ${activeFilters.halal === opt.key ? RED : "#ccc"}`,
              background: activeFilters.halal === opt.key ? RED : WHITE,
              color: activeFilters.halal === opt.key ? WHITE : DARK_TEXT,
              cursor: "pointer", transition: "all 0.2s",
            }}>{opt.label}</button>
          ))}

          {/* Language toggle */}
          <div style={{ display: "flex", gap: 0, borderRadius: 30, overflow: "hidden", border: `3px solid ${RED}` }}>
            <button onClick={() => {
              const next = { ...activeFiltersRef.current, language: 'en' };
              setActiveFilters(next);
              activeFiltersRef.current = next;
            }} style={{
              padding: "12px 28px", fontSize: 28, fontWeight: 600,
              background: activeFilters.language === 'en' ? RED : WHITE,
              color: activeFilters.language === 'en' ? WHITE : DARK_TEXT,
              border: "none", cursor: "pointer",
            }}>English</button>
            <button onClick={() => {
              const next = { ...activeFiltersRef.current, language: 'zh' };
              setActiveFilters(next);
              activeFiltersRef.current = next;
            }} style={{
              padding: "12px 28px", fontSize: 28, fontWeight: 600,
              background: activeFilters.language === 'zh' ? RED : WHITE,
              color: activeFilters.language === 'zh' ? WHITE : DARK_TEXT,
              border: "none", borderLeft: `3px solid ${RED}`, cursor: "pointer",
            }}>中文</button>
          </div>

          {/* Reset filters */}
          {(activeFilters.halal !== "all" || activeFilters.language !== "en") && (
            <button onClick={() => {
              const next = { halal: "all", language: "en" };
              setActiveFilters(next);
              activeFiltersRef.current = next;
              const filtered = getFilteredBrands(next);
              setRecommendations(filtered);
            }} style={{
              padding: "12px 28px", borderRadius: 30, fontSize: 28, fontWeight: 600,
              border: "3px solid #888", background: "#f5f5f5", color: "#666",
              cursor: "pointer",
            }}>{activeFilters.language === 'zh' ? '重置' : 'Reset'}</button>
          )}
        </div>
      </div>

      {/* ── Kimberly's Recommendation ── */}
      {recommendations.length > 0 && (
        <div style={{
          position: "absolute", left: 0, top: 2150, width: 2160,
          padding: "0 80px",
        }}>
          <div style={{
            fontWeight: 600, fontSize: 48, color: RED, marginBottom: 30,
          }}>{activeFilters.language === 'zh' ? '美食摊位' : 'Food Stalls'}</div>

          <div style={{
            display: "flex", gap: 30, overflowX: "auto",
            paddingBottom: 20,
          }}>
            {recommendations.map((brand, i) => {
              const lastAssistantMsg = messages.filter(m => m.role === 'assistant').pop();
              const aiStalls = lastAssistantMsg ? extractRecommendations(lastAssistantMsg.content).map(b => b.stall) : [];
              const isAiPick = aiStalls.includes(brand.stall);
              return (
                <div key={i} style={{
                  minWidth: 580, background: WHITE,
                  borderRadius: 30, padding: "40px 36px",
                  boxShadow: "0 4px 30px rgba(0,0,0,0.1)",
                  border: `4px solid ${isAiPick ? GOLD : "#e0e0e0"}`,
                  flexShrink: 0,
                  position: "relative",
                }}>
                  {isAiPick && (
                    <div style={{
                      position: "absolute", top: -16, left: 24,
                      background: GOLD, color: DARK_TEXT,
                      fontSize: 22, fontWeight: 700,
                      padding: "6px 16px", borderRadius: 12,
                    }}>{activeFilters.language === 'zh' ? 'Kimberly推荐' : "Kimberly's Pick"}</div>
                  )}
                  <div style={{
                    display: "flex", justifyContent: "space-between", alignItems: "flex-start",
                    marginBottom: 16,
                  }}>
                    <div style={{
                      fontWeight: 700, fontSize: 38, color: DARK_TEXT,
                      lineHeight: "46px", flex: 1,
                    }}>{brand.brand}</div>
                    <div style={{ display: "flex", gap: 8 }}>
                      <div style={{
                        background: brand.halal ? "#2E7D32" : "#888",
                        color: WHITE, fontSize: 26, fontWeight: 600,
                        padding: "6px 18px", borderRadius: 20,
                        whiteSpace: "nowrap",
                      }}>{brand.halal ? "Halal" : "Non-Halal"}</div>
                    </div>
                  </div>
                  <div style={{
                    fontSize: 30, color: RED, fontWeight: 600, marginBottom: 12,
                  }}>Stall {brand.stall} · {brand.cuisine}</div>
                  <div style={{
                    fontSize: 30, color: "#666", fontWeight: 500, marginBottom: 12,
                  }}>★ {brand.signature}</div>
                  <div style={{
                    fontSize: 28, color: "#888", lineHeight: "38px",
                  }}>{brand.desc}</div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ── Bottom Sponsor Bar ── */}
      <div style={{
        position: "absolute", left: 0, top: 3454, width: 2160, height: 386,
      }}>
        <img src="assets/sponsor-bar.png" alt="Sponsors" style={{
          width: "100%", height: "100%", objectFit: "cover",
        }} onError={(e) => {
          e.target.outerHTML = '<div style="width:100%;height:100%;background:#f5f5f5;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:40px;">Sponsor Bar</div>';
        }} />
      </div>


      {/* ── Restart Conversation Button (bottom left) ── */}
      <button disabled={messages.length === 0 || speaking || loading} onClick={() => {
        setMessages([]);
        setRecommendations([]);
        setFiltered(false);
        setLoading(false);
        const resetFilters = { halal: "all", language: "en" };
        setActiveFilters(resetFilters);
        activeFiltersRef.current = resetFilters;
        userSpokeFirstRef.current = false;
        pendingSpeakRef.current = null;
        const greeting = activeFiltersRef.current.language === 'zh'
          ? '你好！我是Kimberly，Kopitiam的AI礼宾。今天想吃点什么呢？'
          : 'Hello! I am Kimberly, your AI concierge here at Kopitiam. What are you in the mood for today?';
        if (agentRef.current && didConnected) {
          agentRef.current.speak({ type: 'text', input: greeting }).catch(() => {});
        } else {
          pendingSpeakRef.current = greeting;
        }
      }} style={{
        position: "absolute", left: 80, top: 1891,
        transform: "translateY(-50%)",
        padding: "24px 48px",
        background: WHITE,
        border: "3px solid #ccc",
        borderRadius: 20,
        fontSize: 36, fontWeight: 500,
        color: DARK_TEXT,
        cursor: (messages.length === 0 || speaking || loading) ? "not-allowed" : "pointer",
        opacity: (messages.length === 0 || speaking || loading) ? 0.4 : 1,
        transition: "opacity 0.3s",
      }}>
        Restart Conversation
      </button>

      {!supported && didConnected && (
        <div style={{
          position: "absolute", bottom: 400, left: "50%", transform: "translateX(-50%)",
          color: RED, fontSize: 32,
        }}>Voice input not supported in this browser</div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
