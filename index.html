// ─── Whisper Speech Recognition Hook (tap-to-talk) ───

async function transcribeAudio(audioBlob) {
  const OPENAI_API_KEY = window.__CONFIG.OPENAI_API_KEY;
  const formData = new FormData();
  formData.append('file', audioBlob, 'audio.webm');
  formData.append('model', 'whisper-1');

  console.log('[Whisper] sending blob, size:', audioBlob.size, 'type:', audioBlob.type);
  const res = await fetch('https://api.openai.com/v1/audio/transcriptions', {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${OPENAI_API_KEY}` },
    body: formData,
  });

  const raw = await res.text();
  console.log('[Whisper] status:', res.status, 'body:', raw);
  if (!res.ok) throw new Error(`Whisper ${res.status}: ${raw}`);
  let data;
  try { data = JSON.parse(raw); } catch { throw new Error('Whisper bad JSON: ' + raw); }
  return (data.text || '').trim();
}

function useSpeechRecognition() {
  const [isListening, setIsListening] = useState(false);
  const [transcript, setTranscript] = useState("");
  const [supported, setSupported] = useState(true);
  const mediaRecorderRef = useRef(null);
  const chunksRef = useRef([]);
  const onEndCallbackRef = useRef(null);

  useEffect(() => {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setSupported(false);
    }
  }, []);

  const startListening = useCallback(async () => {
    if (isListening) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
      chunksRef.current = [];

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) chunksRef.current.push(e.data);
      };

      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        const blob = new Blob(chunksRef.current, { type: 'audio/webm' });
        console.log('Recording stopped, blob size:', blob.size, 'chunks:', chunksRef.current.length);
        const cb = onEndCallbackRef.current;
        onEndCallbackRef.current = null;

        if (blob.size > 0) {
          try {
            setTranscript("Transcribing...");
            const text = await transcribeAudio(blob);
            console.log('Whisper result:', text);
            setTranscript(text);
            setIsListening(false);
            if (cb && text.trim()) cb(text.trim());
          } catch (err) {
            console.error("Whisper error:", err);
            setTranscript("");
            setIsListening(false);
          }
        } else {
          console.log('Empty blob, skipping');
          setIsListening(false);
        }
      };

      mediaRecorderRef.current = mediaRecorder;
      mediaRecorder.start();
      setTranscript("");
      setIsListening(true);
    } catch (err) {
      console.error("Mic access error:", err);
      setSupported(false);
    }
  }, [isListening]);

  const stopListening = useCallback((onEnd) => {
    if (mediaRecorderRef.current && isListening) {
      onEndCallbackRef.current = onEnd;
      mediaRecorderRef.current.stop();
    }
  }, [isListening]);

  return { isListening, transcript, supported, startListening, stopListening };
}

// ─── Gemini LLM ───

const SYSTEM_PROMPT = `You are Kimberly, AI concierge at ${MALL_NAME}. There are 21 stalls.
IMPORTANT: Always recommend exactly ONE stall and ONE dish. Never suggest multiple stalls or multiple dishes. Pick the single best match for what the person wants.
When recommending, always mention the stall number (e.g. "Stall 5").
ALWAYS make a recommendation — never just ask a clarifying question. Even if the request is vague (e.g. "food stores", "what do you have"), pick your top recommendation and offer it.
For health-related requests (gastric, sore throat, flu, post-surgery), recommend light and gentle options like porridge (Stall 8), vegetarian (Stall 5), or soup (Stall 10/11). Avoid heavy or rich dishes like organ meats.
Be friendly, warm, and conversational. Always respond in 4-6 sentences — never fewer than 4.
Here is the stall directory:\n` + BRANDS.map(b =>
  `Stall ${b.stall}: ${b.brand} (${b.cuisine})${b.halal ? ' [Halal]' : ''} - ${b.signature}. ${b.desc}`
).join('\n');

async function callGemini(conversationHistory) {
  const GEMINI_API_KEY = window.__CONFIG.GEMINI_API_KEY;
  const GEMINI_MODEL = window.__CONFIG.GEMINI_MODEL;
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`;

  const contents = conversationHistory.map(msg => ({
    role: msg.role === 'assistant' ? 'model' : 'user',
    parts: [{ text: msg.content }]
  }));

  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
      contents,
    })
  });

  if (!res.ok) throw new Error(`Gemini API error: ${res.status}`);
  const data = await res.json();
  return data.candidates?.[0]?.content?.parts?.[0]?.text || 'Sorry, I could not generate a response.';
}

function App() {
  const [started, setStarted] = useState(false);
  const [messages, setMessages] = useState([]);
  const [loading, setLoading] = useState(false);
  const [speaking, setSpeaking] = useState(false);
  const [didConnected, setDidConnected] = useState(false);
  const [videoReady, setVideoReady] = useState(false);
  const [didStatus, setDidStatus] = useState("Initializing...");
  const [filtered, setFiltered] = useState(false);
  const [recommendations, setRecommendations] = useState([]);
  const videoRef = useRef(null);
  const agentRef = useRef(null);
  const chatEndRef = useRef(null);
  const userSpokeFirstRef = useRef(false);
  const greetingTimeoutRef = useRef(null);
  const pendingSpeakRef = useRef(null);
  const { isListening, transcript, supported, startListening, stopListening } = useSpeechRecognition();

  const D_ID_API_KEY = window.__CONFIG?.D_ID_API_KEY;
  const D_ID_AGENT_ID = window.__CONFIG?.D_ID_AGENT_ID;

  // Extract recommended stalls from AI response (order-preserving, stall numbers only)
  function extractRecommendations(text) {
    if (!text) return [];
    const stallMatches = [...text.toLowerCase().matchAll(/stall\s*(\d+)/g)].map(m => parseInt(m[1]));
    // Deduplicate while preserving order
    const seen = new Set();
    const ordered = stallMatches.filter(s => { if (seen.has(s)) return false; seen.add(s); return true; });
    return ordered.map(s => BRANDS.find(b => b.stall === s)).filter(Boolean);
  }

  // Auto-scroll chat to bottom
  useEffect(() => {
    if (chatEndRef.current) chatEndRef.current.scrollIntoView({ behavior: "smooth" });
  }, [messages, loading]);

  // Connect D-ID only after user clicks Start
  useEffect(() => {
    if (!started) return;
    let cancelled = false;
    async function waitForSDK() {
      if (window.__DID_READY) return;
      return new Promise(resolve => window.addEventListener('did-ready', resolve, { once: true }));
    }
    async function connectDID() {
      await waitForSDK();
      const did = window.__DID;
      if (!did) { setDidStatus("SDK failed to load"); return; }
      try {
        const agent = await did.createAgentManager(D_ID_AGENT_ID, {
          auth: { type: 'basic', token: D_ID_API_KEY },
          callbacks: {
            onSrcObjectReady(srcObject) {
              if (videoRef.current) {
                videoRef.current.srcObject = srcObject;
                videoRef.current.onloadeddata = () => videoRef.current.play().catch(() => {});
                videoRef.current.play().catch(() => {});
              }
            },
            onConnectionStateChange(state) {
              if (cancelled) return;
              setDidStatus(state);
              if (state === 'connected') {
                setDidConnected(true);
                if (videoRef.current && videoRef.current.srcObject) {
                  videoRef.current.play().catch(() => {});
                }
                // If user already spoke, speak their queued response instead of greeting
                if (pendingSpeakRef.current) {
                  const text = pendingSpeakRef.current;
                  pendingSpeakRef.current = null;
                  setTimeout(() => {
                    if (agentRef.current) agentRef.current.speak({ type: 'text', input: text }).catch(() => {});
                  }, 500);
                } else if (!userSpokeFirstRef.current) {
                  // Only greet if user hasn't started talking
                  greetingTimeoutRef.current = setTimeout(() => {
                    if (agentRef.current && !userSpokeFirstRef.current) {
                      agentRef.current.speak({ type: 'text', input: 'Hello! I am Kimberly, your AI concierge here at Kopitiam. What are you in the mood for today?' }).catch(() => {});
                    }
                  }, 500);
                }
                setTimeout(() => { setVideoReady(true); }, 4000);
              }
            },
            onVideoStateChange(state) {
              if (state === 'START' || state === 'speaking') {
                setSpeaking(true); setVideoReady(true);
              }
              if (state === 'STOP' || state === 'idle' || state === 'stopped') {
                setSpeaking(false);
              }
            },
            onNewMessage(msgs, type) {
              // Messages handled by Gemini directly, not D-ID LLM
            }
          },
          streamOptions: { compatibilityMode: 'auto', streamWarmup: true }
        });
        agentRef.current = agent;
        window.__agentRef = agent;
        console.log('Agent methods:', Object.getOwnPropertyNames(Object.getPrototypeOf(agent)));
        await agent.connect();
      } catch (err) {
        console.error("D-ID connect error:", err);
        setDidStatus("Error: " + err.message);
      }
    }
    connectDID();

    // Disconnect when tab closes/hides so D-ID session is released server-side
    const handleUnload = () => {
      try { agentRef.current && agentRef.current.disconnect(); } catch (e) {}
      agentRef.current = null;
    };
    window.addEventListener('pagehide', handleUnload);
    window.addEventListener('beforeunload', handleUnload);

    return () => {
      cancelled = true;
      window.removeEventListener('pagehide', handleUnload);
      window.removeEventListener('beforeunload', handleUnload);
      if (agentRef.current) {
        try { agentRef.current.disconnect().catch(() => {}); } catch (e) {}
        agentRef.current = null;
      }
    };
  }, [started]);

  const micDisabled = speaking || loading;

  async function sendToAgent(text) {
    if (!text.trim()) return;
    const check = filterMessage(text);
    const userMsg = { role: 'user', content: text };
    setMessages(prev => [...prev, userMsg]);
    setFiltered(false);
    if (!check.allowed) {
      setMessages(prev => [...prev, { role: 'assistant', content: check.reason, filtered: true }]);
      setFiltered(true);
      return;
    }
    setRecommendations([]);
    setLoading(true);
    try {
      // Build conversation history for Gemini
      const history = [...messages, userMsg].filter(m => !m.filtered);
      const reply = await callGemini(history);
      const assistantMsg = { role: 'assistant', content: reply };
      setMessages(prev => [...prev, assistantMsg]);
      setRecommendations(extractRecommendations(reply));
      setLoading(false);
      // Make avatar speak the response (or queue if D-ID not ready)
      if (agentRef.current && didConnected) {
        agentRef.current.speak({ type: 'text', input: reply }).catch(err => {
          console.error("speak error:", err);
        });
      } else {
        pendingSpeakRef.current = reply;
      }
    } catch (err) {
      console.error("Gemini error:", err);
      setMessages(prev => [...prev, { role: 'assistant', content: "Error: " + (err.message || err) }]);
      setLoading(false);
    }
  }

  const pendingTranscriptRef = useRef(null);

  function handleMicClick() {
    if (micDisabled) return;
    if (isListening) {
      console.log('Stopping recording...');
      stopListening((text) => {
        console.log('stopListening callback, text:', text);
        sendToAgent(text);
      });
    } else {
      console.log('Starting recording...');
      // Cancel AI greeting if user talks first
      userSpokeFirstRef.current = true;
      if (greetingTimeoutRef.current) {
        clearTimeout(greetingTimeoutRef.current);
        greetingTimeoutRef.current = null;
      }
      startListening();
    }
  }

  // ─── Start Screen ───
  if (!started) {
    return (
      <div style={{
        width: 2160, height: 3840, position: "relative", background: WHITE,
        display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
        backgroundImage: "linear-gradient(0deg, rgba(232,232,232,0.82), rgba(232,232,232,0.82)), url(assets/background.png)",
        backgroundSize: "cover", backgroundPosition: "center",
      }}>
        {/* Logo */}
        <img src="assets/kopitiam-logo.png" alt="Kopitiam" style={{ width: 800, marginBottom: 40 }} onError={(e) => { e.target.style.display = 'none'; }} />
        <div style={{ fontSize: 64, fontWeight: 600, color: "#000", marginBottom: 40 }}>AI CONCIERGE</div>
        <button onClick={() => setStarted(true)} style={{
          padding: "40px 100px", background: RED, color: WHITE,
          border: "none", borderRadius: 30, fontSize: 48, fontWeight: 700,
          cursor: "pointer", boxShadow: "0 4px 40px rgba(207,70,58,0.4)"
        }}>
          Start Conversation
        </button>
        <div style={{ color: "#888", fontSize: 32, marginTop: 30 }}>Tap to begin</div>
      </div>
    );
  }

  // ─── Main Kiosk Screen ───
  return (
    <div style={{
      width: 2160, height: 3840, position: "relative", background: WHITE, overflow: "hidden",
      backgroundImage: "linear-gradient(0deg, rgba(232,232,232,0.82), rgba(232,232,232,0.82)), url(assets/background.png)",
      backgroundSize: "cover", backgroundPosition: "center",
    }}>

      {/* ── Header: Logo + AI CONCIERGE ── */}
      <div style={{ position: "absolute", top: 0, left: 0, width: 2160, textAlign: "center" }}>
        <div style={{
          fontWeight: 500, fontSize: 40, lineHeight: "48px", letterSpacing: "0.2em",
          color: "#000", marginTop: 91,
        }}>WELCOME TO</div>
        <img src="assets/kopitiam-logo.png" alt="Kopitiam" style={{
          width: 1222, height: "auto", margin: "0 auto", display: "block",
        }} onError={(e) => {
          e.target.outerHTML = '<div style="font-size:120px;font-weight:800;color:#CF463A;font-style:italic;margin:20px 0;">KOPITIAM</div>';
        }} />
        <div style={{
          fontWeight: 500, fontSize: 40, lineHeight: "48px", letterSpacing: "0.2em",
          color: "#000", marginTop: 10,
        }}>AI CONCIERGE</div>
      </div>

      {/* ── Left Sidebar Nav ── */}
      <div style={{
        position: "absolute", left: 59, top: 340,
        display: "flex", flexDirection: "column", gap: 29,
      }}>
        <NavButton icon={ICONS.home} label="Home" />
        <NavButton icon={ICONS.seats} label="Seats" />
        <NavButton icon={ICONS.stores} label="Stores" />
        <NavButton icon={ICONS.food} label="Food" />
        <NavButton icon={ICONS.chat} label={<span style={{ fontSize: 36, lineHeight: "40px" }}>Chat with<br/>me</span>} active />
      </div>

      {/* ── Kimberly Avatar (D-ID video, right side) ── */}
      <div style={{
        position: "absolute", width: 700, height: 700,
        left: 1380, top: 500, overflow: "hidden",
        borderRadius: "50%",
        border: `6px solid ${GOLD}`,
        boxShadow: speaking ? `0 0 60px rgba(245,177,80,0.4)` : "0 8px 40px rgba(0,0,0,0.15)",
        transition: "all 0.3s",
      }}>
        <video ref={videoRef} autoPlay playsInline
          onLoadedMetadata={() => { if (videoRef.current) videoRef.current.play().catch(() => {}); }}
          style={{ width: "100%", height: "100%", objectFit: "cover" }}
        />
        {!videoReady && (
          <div style={{
            position: "absolute", inset: 0, display: "flex", flexDirection: "column",
            alignItems: "center", justifyContent: "center", background: "rgba(232,232,232,0.5)",
          }}>
            <div style={{ width: 60, height: 60, border: "4px solid #ddd", borderTopColor: RED, borderRadius: "50%", animation: "spin 1s linear infinite" }} />
            <span style={{ color: "#888", fontSize: 32, marginTop: 20 }}>{didConnected ? "Loading avatar..." : didStatus}</span>
          </div>
        )}
      </div>

      {/* ── Chat Area (text message style) ── */}
      <div style={{
        position: "absolute", left: 400, top: 500, width: 900, height: 1150,
        display: "flex", flexDirection: "column",
        background: "transparent", borderRadius: 30,
        padding: 20,
      }}>
        <div style={{
          flex: 1, overflowY: "auto",
          display: "flex", flexDirection: "column", gap: 24,
        }}>
          {/* Initial greeting */}
          {messages.length === 0 && !loading && !isListening && (
            <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-start" }}>
              <div style={{ fontWeight: 600, fontSize: 30, color: RED, marginBottom: 8, marginLeft: 8 }}>Kimberly</div>
              <div style={{
                background: "rgba(245, 177, 80, 0.6)",
                borderRadius: "20px 20px 20px 4px",
                padding: "24px 32px", maxWidth: "70%",
                fontSize: 32, lineHeight: "42px", color: "#000",
              }}>
                Hello! I'm Kimberly, your AI concierge here at Kopitiam, Tan Tock Seng Hospital. We have 21 food stalls with local favourites, halal options, and more. What are you in the mood for?
              </div>
            </div>
          )}

          {/* Message history */}
          {messages.map((msg, i) => (
            msg.role === 'user' ? (
              <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "flex-end" }}>
                <div style={{ fontWeight: 600, fontSize: 30, color: "#555", marginBottom: 8, marginRight: 8 }}>You</div>
                <div style={{
                  background: RED,
                  borderRadius: "20px 20px 4px 20px",
                  padding: "24px 32px", maxWidth: "70%",
                  fontSize: 32, lineHeight: "42px", color: WHITE,
                }}>
                  {msg.content}
                </div>
              </div>
            ) : (
              <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "flex-start" }}>
                <div style={{ fontWeight: 600, fontSize: 30, color: RED, marginBottom: 8, marginLeft: 8 }}>Kimberly</div>
                <div style={{
                  background: "rgba(245, 177, 80, 0.6)",
                  borderRadius: "20px 20px 20px 4px",
                  padding: "24px 32px", maxWidth: "70%",
                  fontSize: 32, lineHeight: "42px",
                  color: msg.filtered ? RED : "#000",
                }}>
                  {msg.content}
                </div>
              </div>
            )
          ))}

          {/* Listening indicator */}
          {isListening && (
            <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end" }}>
              <div style={{ fontWeight: 600, fontSize: 30, color: "#555", marginBottom: 8, marginRight: 8 }}>You</div>
              <div style={{
                background: "rgba(207,70,58,0.15)",
                borderRadius: "20px 20px 4px 20px",
                padding: "24px 32px", maxWidth: "70%",
                fontSize: 32, lineHeight: "42px", color: RED,
                border: `2px dashed ${RED}`,
              }}>
                {transcript || "Listening..."}
              </div>
            </div>
          )}

          {/* Loading indicator */}
          {loading && (
            <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-start" }}>
              <div style={{ fontWeight: 600, fontSize: 30, color: RED, marginBottom: 8, marginLeft: 8 }}>Kimberly</div>
              <div style={{
                background: "rgba(245, 177, 80, 0.3)",
                borderRadius: "20px 20px 20px 4px",
                padding: "24px 32px",
                fontSize: 32, lineHeight: "42px", color: "#666",
              }}>
                <span style={{ animation: "pulse 1.5s infinite" }}>Thinking...</span>
              </div>
            </div>
          )}

          <div ref={chatEndRef} />
        </div>
      </div>

      {/* ── Speak Button ── */}
      <div style={{
        position: "absolute", left: "50%", top: 1753,
        transform: "translateX(-50%)",
        display: "flex", flexDirection: "column", alignItems: "center",
      }}>
        <button onClick={handleMicClick} style={{
          width: 281, height: 277, borderRadius: "50%",
          background: micDisabled ? "#999" : RED,
          border: `10px solid ${micDisabled ? "#bbb" : GOLD}`,
          boxShadow: isListening
            ? "0 0 0 0 rgba(207,70,58,0.5)"
            : "0px 4px 4px rgba(0, 0, 0, 0.25)",
          color: WHITE,
          cursor: micDisabled ? "not-allowed" : "pointer",
          opacity: micDisabled ? 0.4 : 1,
          display: "flex", alignItems: "center", justifyContent: "center",
          transition: "all 0.3s",
          animation: isListening ? "micPulse 1.5s infinite" : "none",
        }}>
          <svg width="127" height="123" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
        {!didConnected && (
          <div style={{ color: "#888", fontSize: 28, marginTop: 20 }}>{didStatus}</div>
        )}
        {isListening && (
          <div style={{ color: RED, fontSize: 32, fontWeight: 600, marginTop: 20 }}>Listening...</div>
        )}
      </div>


      {/* ── Kimberly's Recommendation ── */}
      {recommendations.length > 0 && (
        <div style={{
          position: "absolute", left: 0, top: 2100, width: 2160,
          padding: "0 80px",
        }}>
          <div style={{
            fontWeight: 600, fontSize: 48, color: RED, marginBottom: 30,
          }}>Kimberly's Recommendation</div>

          <div style={{
            display: "flex", gap: 30, overflowX: "auto",
            paddingBottom: 20,
          }}>
            {recommendations.map((brand, i) => (
              <div key={i} style={{
                minWidth: 580, background: WHITE,
                borderRadius: 30, padding: "40px 36px",
                boxShadow: "0 4px 30px rgba(0,0,0,0.1)",
                border: `3px solid ${GOLD}`,
                flexShrink: 0,
              }}>
                <div style={{
                  display: "flex", justifyContent: "space-between", alignItems: "flex-start",
                  marginBottom: 16,
                }}>
                  <div style={{
                    fontWeight: 700, fontSize: 38, color: DARK_TEXT,
                    lineHeight: "46px", flex: 1,
                  }}>{brand.brand}</div>
                  <div style={{
                    background: brand.halal ? "#2E7D32" : "#888",
                    color: WHITE, fontSize: 26, fontWeight: 600,
                    padding: "6px 18px", borderRadius: 20,
                    marginLeft: 16, whiteSpace: "nowrap",
                  }}>{brand.halal ? "Halal" : "Non-Halal"}</div>
                </div>
                <div style={{
                  fontSize: 30, color: RED, fontWeight: 600, marginBottom: 12,
                }}>Stall {brand.stall} · {brand.cuisine}</div>
                <div style={{
                  fontSize: 30, color: "#666", fontWeight: 500, marginBottom: 12,
                }}>★ {brand.signature}</div>
                <div style={{
                  fontSize: 28, color: "#888", lineHeight: "38px",
                }}>{brand.desc}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* ── Bottom Sponsor Bar ── */}
      <div style={{
        position: "absolute", left: 0, top: 3454, width: 2160, height: 386,
      }}>
        <img src="assets/sponsor-bar.png" alt="Sponsors" style={{
          width: "100%", height: "100%", objectFit: "cover",
        }} onError={(e) => {
          e.target.outerHTML = '<div style="width:100%;height:100%;background:#f5f5f5;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:40px;">Sponsor Bar</div>';
        }} />
      </div>


      {/* ── Restart Conversation Button (bottom left) ── */}
      <button disabled={messages.length === 0 || speaking || loading} onClick={() => {
        setMessages([]);
        setRecommendations([]);
        setFiltered(false);
        setLoading(false);
        userSpokeFirstRef.current = false;
        pendingSpeakRef.current = null;
      }} style={{
        position: "absolute", left: 80, top: 1891,
        transform: "translateY(-50%)",
        padding: "24px 48px",
        background: WHITE,
        border: "3px solid #ccc",
        borderRadius: 20,
        fontSize: 36, fontWeight: 500,
        color: DARK_TEXT,
        cursor: (messages.length === 0 || speaking || loading) ? "not-allowed" : "pointer",
        opacity: (messages.length === 0 || speaking || loading) ? 0.4 : 1,
        transition: "opacity 0.3s",
      }}>
        Restart Conversation
      </button>

      {!supported && didConnected && (
        <div style={{
          position: "absolute", bottom: 400, left: "50%", transform: "translateX(-50%)",
          color: RED, fontSize: 32,
        }}>Voice input not supported in this browser</div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
