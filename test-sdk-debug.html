<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LiveAvatar SDK Debug</title>
<script>
window.__CONFIG = {
  LIVEAVATAR_API_KEY: '860a7348-9cfa-4fcf-9f33-4b6f4a6c2721',
  LIVEAVATAR_AVATAR_ID: '1e614fa7-6eeb-4c81-a418-2865ce420dd1',
  LIVEAVATAR_VOICE_ID: 'de5574fc-009e-4a01-a881-9919ef8f5a0c',
};
</script>
</head>
<body>
<button id="start">Start</button>
<button id="send" disabled>Send "hello"</button>
<video id="video" autoplay playsinline muted style="width:400px;height:400px;border-radius:50%"></video>
<div id="status">Idle</div>
<div id="chat" style="font-family:monospace;white-space:pre-wrap"></div>

<script type="module">
const API_KEY = window.__CONFIG.LIVEAVATAR_API_KEY;
const AVATAR_ID = window.__CONFIG.LIVEAVATAR_AVATAR_ID;
const VOICE_ID = window.__CONFIG.LIVEAVATAR_VOICE_ID;

const status = document.getElementById('status');
const chat = document.getElementById('chat');
const video = document.getElementById('video');
let session = null;

function log(msg) {
  console.log(msg);
  chat.textContent += msg + '\n';
}

async function createToken() {
  const res = await fetch('https://api.liveavatar.com/v1/sessions/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-API-KEY': API_KEY },
    body: JSON.stringify({
      avatar_id: AVATAR_ID,
      mode: 'FULL',
      avatar_persona: {
        voice_id: VOICE_ID,
        first_message: "Hello! I'm Kimberly.",
        system_prompt: "You are a helpful assistant. Keep responses short."
      }
    })
  });
  const data = await res.json();
  log('Token response: ' + JSON.stringify(data, null, 2));
  return data.data.session_token;
}

document.getElementById('start').onclick = async () => {
  try {
    status.textContent = 'Loading SDK...';
    const { LiveAvatarSession, AgentEventsEnum, SessionEvent, VoiceChatEvent } = await import('https://esm.sh/@heygen/liveavatar-web-sdk');
    
    status.textContent = 'Creating session...';
    const token = await createToken();
    
    status.textContent = 'Starting session...';
    session = new LiveAvatarSession(token, {
      voiceChat: true,
      apiUrl: 'https://api.liveavatar.com'
    });

    // Log ALL events
    Object.values(AgentEventsEnum).forEach(eventName => {
      session.on(eventName, (data) => {
        log(`[EVENT] ${eventName}: ${JSON.stringify(data).slice(0, 200)}`);
      });
    });

    session.on(SessionEvent.SESSION_STATE_CHANGED, (state) => {
      log(`[STATE] ${state}`);
      status.textContent = 'State: ' + state;
    });

    session.on(SessionEvent.SESSION_STREAM_READY, () => {
      log('[STREAM READY]');
    });

    session.voiceChat.on(VoiceChatEvent.STATE_CHANGED, (state) => {
      log(`[VOICE STATE] ${state}`);
    });

    session.voiceChat.on(VoiceChatEvent.MUTED, () => log('[VOICE MUTED]'));
    session.voiceChat.on(VoiceChatEvent.UNMUTED, () => log('[VOICE UNMUTED]'));

    await session.start();
    session.attach(video);
    
    status.textContent = 'Starting voice chat...';
    await session.voiceChat.start();
    
    status.textContent = 'Connected! Speak or click Send.';
    document.getElementById('send').disabled = false;
    log('=== Ready ===');

  } catch (err) {
    status.textContent = 'Error: ' + err.message;
    log('ERROR: ' + err.message);
    console.error(err);
  }
};

document.getElementById('send').onclick = async () => {
  if (!session) return;
  log('Sending "hello" via message()...');
  try {
    await session.message('hello');
    log('message() sent');
  } catch (e) {
    log('message() error: ' + e.message);
  }
};
</script>
</body>
</html>
