<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LiveAvatar SDK Test</title>
<script>
window.__CONFIG = {
  LIVEAVATAR_API_KEY: '860a7348-9cfa-4fcf-9f33-4b6f4a6c2721',
  LIVEAVATAR_AVATAR_ID: '1e614fa7-6eeb-4c81-a418-2865ce420dd1',
  LIVEAVATAR_VOICE_ID: 'de5574fc-009e-4a01-a881-9919ef8f5a0c',
};
</script>
</head>
<body>
<button id="start">Start</button>
<video id="video" autoplay playsinline muted style="width:400px;height:400px;border-radius:50%"></video>
<div id="status">Idle</div>
<div id="chat"></div>

<script type="module">
const API_KEY = window.__CONFIG.LIVEAVATAR_API_KEY;
const AVATAR_ID = window.__CONFIG.LIVEAVATAR_AVATAR_ID;
const VOICE_ID = window.__CONFIG.LIVEAVATAR_VOICE_ID;

const status = document.getElementById('status');
const chat = document.getElementById('chat');
const video = document.getElementById('video');

async function createToken() {
  const res = await fetch('https://api.liveavatar.com/v1/sessions/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-API-KEY': API_KEY },
    body: JSON.stringify({
      avatar_id: AVATAR_ID,
      mode: 'FULL',
      avatar_persona: {
        voice_id: VOICE_ID,
        first_message: "Hello! I'm Kimberly.",
        system_prompt: "You are a helpful assistant."
      }
    })
  });
  const data = await res.json();
  return data.data.session_token;
}

document.getElementById('start').onclick = async () => {
  try {
    status.textContent = 'Loading SDK...';
    const { LiveAvatarSession, AgentEventsEnum } = await import('https://esm.sh/@heygen/liveavatar-web-sdk');
    
    status.textContent = 'Creating session...';
    const token = await createToken();
    
    status.textContent = 'Starting session...';
    const session = new LiveAvatarSession(token, {
      voiceChat: true,
      apiUrl: 'https://api.liveavatar.com'
    });

    session.on(AgentEventsEnum.AVATAR_SPEAK_STARTED, () => {
      status.textContent = 'Avatar speaking...';
      console.log('[SDK] Avatar speak started');
    });
    session.on(AgentEventsEnum.AVATAR_SPEAK_ENDED, () => {
      status.textContent = 'Listening...';
      console.log('[SDK] Avatar speak ended');
    });
    session.on(AgentEventsEnum.USER_SPEAK_STARTED, () => {
      status.textContent = 'You are speaking...';
      console.log('[SDK] User speak started');
    });
    session.on(AgentEventsEnum.USER_SPEAK_ENDED, () => {
      status.textContent = 'Listening...';
      console.log('[SDK] User speak ended');
    });
    session.on(AgentEventsEnum.USER_TRANSCRIPTION, (e) => {
      console.log('[SDK] User said:', e.text);
      chat.innerHTML += `<div style="color:blue">You: ${e.text}</div>`;
    });
    session.on(AgentEventsEnum.AVATAR_TRANSCRIPTION, (e) => {
      console.log('[SDK] Avatar said:', e.text);
      chat.innerHTML += `<div style="color:green">Kimberly: ${e.text}</div>`;
    });

    await session.start();
    session.attach(video);
    
    status.textContent = 'Starting voice chat...';
    await session.voiceChat.start();
    
    status.textContent = 'Connected! Speak to Kimberly...';
    console.log('[SDK] Session started, voice chat active');
  } catch (err) {
    status.textContent = 'Error: ' + err.message;
    console.error(err);
  }
};
</script>
</body>
</html>
