function getCategoryLabel(cat, lang) {
  const map = {
    light: { en: "Light", zh: "清淡" },
    local: { en: "Local", zh: "本地" },
    chinese: { en: "Chinese", zh: "中餐" },

  };

}

function buildSystemPrompt(activeFilters) {
  let prompt = `You are Kimberly, AI concierge at Kopitiam Food Court at Tan Tock Seng Hospital. There are 21 food stalls.
IMPORTANT: Always recommend exactly ONE stall and ONE dish. Never suggest multiple stalls or multiple dishes. Pick the single best match for what the person wants.
When recommending, always mention the stall number (e.g. "Stall 5").
ALWAYS make a recommendation — never just ask a clarifying question. Even if the request is vague (e.g. "food stores", "what do you have"), pick your top recommendation and offer it.
For health-related requests (gastric, sore throat, flu, post-surgery), recommend light and gentle options like porridge (Stall 8), vegetarian (Stall 5), or soup (Stall 10/11). Avoid heavy or rich dishes like organ meats.
Halal rule: pork, lard, char siew, bak kut teh, bak chor mee, pig organ, roast pork, wanton (with pork), and alcohol are never halal. If the user asks for something contradictory like "halal pork", "halal bak kut teh", or "halal char siew", politely point out that pork is not halal and suggest a genuinely halal alternative (e.g. halal chicken rice at Stall 14, beef rendang at Stall 19, ayam penyet at Stall 20). Never pretend a non-halal dish is halal.`;

  if (activeFilters.halal !== "all" || activeFilters.language !== "en") {
    prompt += "\n\nCURRENT ACTIVE FILTERS — ONLY recommend stalls that match ALL of these:";
    if (activeFilters.halal === "halal") prompt += "\n- Halal: YES (only halal-certified stalls)";
    if (activeFilters.halal === "non-halal") prompt += "\n- Halal: NO (only non-halal stalls)";
    if (activeFilters.language === 'zh') prompt += "\n- Language: Chinese (用户说中文，你必须用中文回复)";
    prompt += "\nIf no stall matches ALL filters, politely say so and suggest the closest match.";
  }

  if (activeFilters.language === 'zh') {
    prompt += "\n\n你必须用中文回复。所有内容必须用简体中文书写。";
  }

  prompt += "\n\nHere is the stall directory:";
  BRANDS.forEach(b => {
    prompt += `\nStall ${b.stall}: ${b.brand} (${b.cuisine})${b.halal ? ' [Halal]' : ''} [${getCategoryLabel(b.category, activeFilters.language)}] - ${b.signature}. ${b.desc}`;
  });
  return prompt;
}

function extractRecommendations(text) {
  if (!text) return [];
  const stallMatches = [...text.toLowerCase().matchAll(/stall\s*(\d+)/g)].map(m => parseInt(m[1]));
  const seen = new Set();
  const ordered = stallMatches.filter(s => { if (seen.has(s)) return false; seen.add(s); return true; });
  return ordered.map(s => BRANDS.find(b => b.stall === s)).filter(Boolean);
}

function getFilteredBrands(filters) {
  return BRANDS.filter(b => {
    if (filters.halal === "halal" && !b.halal) return false;
    if (filters.halal === "non-halal" && b.halal) return false;
    return true;
  });
}

// ─── Perf timing ───
const perf = { speechStart: 0, silenceAt: 0, whisperStart: 0, whisperEnd: 0, geminiStart: 0, geminiEnd: 0, speakCall: 0, speakStart: 0, speakEnd: 0 };
const ms = (a, b) => (b - a).toFixed(0) + 'ms';
function perfReset() {
  Object.keys(perf).forEach(k => perf[k] = 0);
}
function perfLogTurn() {
  const { speechStart, silenceAt, whisperStart, whisperEnd, geminiStart, geminiEnd, speakCall, speakStart } = perf;
  const rows = [];
  if (speechStart && silenceAt) rows.push(['User speech duration', ms(speechStart, silenceAt)]);
  if (silenceAt && whisperStart) rows.push(['Silence→Whisper start', ms(silenceAt, whisperStart)]);
  if (whisperStart && whisperEnd) rows.push(['Whisper transcription', ms(whisperStart, whisperEnd)]);
  if (whisperEnd && geminiStart) rows.push(['Whisper→Gemini start', ms(whisperEnd, geminiStart)]);
  if (geminiStart && geminiEnd) rows.push(['Gemini reply', ms(geminiStart, geminiEnd)]);
  if (geminiEnd && speakCall) rows.push(['Gemini→speak() call', ms(geminiEnd, speakCall)]);
  if (speakCall && speakStart) rows.push(['LiveAvatar speak→audio start', ms(speakCall, speakStart)]);
  if (silenceAt && speakStart) rows.push(['TOTAL: silence→Kimberly speaks', ms(silenceAt, speakStart)]);
  console.log('%c[PERF] Turn breakdown', 'font-weight:bold;color:#CF463A');
  console.table(rows);
}

// ─── Whisper + VAD (same as before) ───

async function transcribeAudio(audioBlob) {
  const OPENAI_API_KEY = window.__CONFIG.OPENAI_API_KEY;
  const formData = new FormData();
  formData.append('file', audioBlob, 'audio.webm');
  formData.append('model', 'whisper-1');
  formData.append('language', 'en');
  formData.append('temperature', '0');
  formData.append('prompt', 'Food court customer asking about stalls, dishes, halal options.');
  formData.append('response_format', 'verbose_json');

  console.log('[Whisper] sending blob, size:', audioBlob.size, 'type:', audioBlob.type);
  perf.whisperStart = performance.now();
  const res = await fetch('https://api.openai.com/v1/audio/transcriptions', {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${OPENAI_API_KEY}` },
    body: formData,
  });

  const raw = await res.text();
  perf.whisperEnd = performance.now();
  console.log('[PERF] Whisper:', ms(perf.whisperStart, perf.whisperEnd));
  console.log('[Whisper] status:', res.status, 'body:', raw);
  if (!res.ok) throw new Error(`Whisper ${res.status}: ${raw}`);
  let data;
  try { data = JSON.parse(raw); } catch { throw new Error('Whisper bad JSON: ' + raw); }
  const segments = data.segments || [];
  const noSpeechProb = segments.length
    ? Math.max(...segments.map(s => s.no_speech_prob ?? 0))
    : 0;
  const avgLogprob = segments.length
    ? Math.min(...segments.map(s => s.avg_logprob ?? 0))
    : 0;
  return {
    text: (data.text || '').trim(),
    noSpeechProb,
    avgLogprob,
  };
}

const WHISPER_NO_SPEECH_THRESHOLD = 0.6;
const WHISPER_LOGPROB_THRESHOLD = -1.0;

const WHISPER_HALLUCINATION_SUBSTRINGS = [
  'thanks for watching', 'thank you for watching',
  'subscribe to the channel', 'please subscribe', 'like and subscribe',
  'dont forget to like', 'dont forget to subscribe',
  'see you next time', 'see you in the next video',
  'hit the bell', 'ring the bell',
  'pissedconsumer', 'please see review', 'review no',
];
const WHISPER_HALLUCINATION_EXACT = [
  'you', 'thank you', 'thanks', 'bye', 'okay', 'ok',
  '.', '...', 'music', '[music]', '(music)', 'applause', '[applause]',
];

function isHallucination(text) {
  if (!text) return true;
  const norm = text.toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
  if (norm.length < 2) return true;
  if (WHISPER_HALLUCINATION_EXACT.includes(norm)) return true;
  if (WHISPER_HALLUCINATION_SUBSTRINGS.some(sub => norm.includes(sub))) return true;
  if (/\b(?:https?:\/\/|www\.|\.com|\.org|\.net|\.io)\b/i.test(text)) return true;
  if (/[^\x00-\x7F]/.test(text)) return true;
  return false;
}

const VAD_SPEECH_THRESHOLD = 0.02;
const VAD_SILENCE_MS = 2000;
const VAD_MIN_SPEECH_MS = 500;
const VAD_MIN_LOUD_FRAMES = 8;

function useVoiceActivity({ enabled, paused, onUtterance, onRejected, onStreamReady }) {
  const [isListening, setIsListening] = useState(false);
  const [isSpeaking, setIsSpeaking] = useState(false);
  const [isTranscribing, setIsTranscribing] = useState(false);
  const [supported, setSupported] = useState(true);
  const onRejectedRef = useRef(onRejected);
  useEffect(() => { onRejectedRef.current = onRejected; }, [onRejected]);

  const streamRef = useRef(null);
  const audioCtxRef = useRef(null);
  const analyserRef = useRef(null);
  const rafRef = useRef(null);
  const recorderRef = useRef(null);
  const chunksRef = useRef([]);
  const speakingRef = useRef(false);
  const speechStartRef = useRef(0);
  const lastVoiceAtRef = useRef(0);
  const loudFramesRef = useRef(0);
  const pausedRef = useRef(paused);
  const committedRef = useRef(false);
  const prevPausedRef = useRef(paused);
  const onUtteranceRef = useRef(onUtterance);

  useEffect(() => { pausedRef.current = paused; }, [paused]);
  useEffect(() => { onUtteranceRef.current = onUtterance; }, [onUtterance]);

  useEffect(() => {
    if (prevPausedRef.current && !paused) {
      committedRef.current = false;
      console.log('[VAD] thaw — ready to listen');
    }
    prevPausedRef.current = paused;
  }, [paused]);

  useEffect(() => {
    if (paused && speakingRef.current) {
      speakingRef.current = false;
      setIsSpeaking(false);
      if (recorderRef.current && recorderRef.current.state === 'recording') {
        recorderRef.current._discard = true;
        try { recorderRef.current.stop(); } catch (e) {}
      }
    }
  }, [paused]);

  useEffect(() => {
    if (!enabled) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setSupported(false);
      return;
    }
    let cancelled = false;

    async function start() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });
        if (cancelled) { stream.getTracks().forEach(t => t.stop()); return; }
        streamRef.current = stream;
        if (onStreamReady) onStreamReady(stream);

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        audioCtxRef.current = ctx;
        const source = ctx.createMediaStreamSource(stream);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 1024;
        source.connect(analyser);
        analyserRef.current = analyser;

        const data = new Uint8Array(analyser.fftSize);
        setIsListening(true);

        const tick = () => {
          rafRef.current = requestAnimationFrame(tick);
          if (pausedRef.current || committedRef.current) return;

          analyser.getByteTimeDomainData(data);
          let sum = 0;
          for (let i = 0; i < data.length; i++) {
            const v = (data[i] - 128) / 128;
            sum += v * v;
          }
          const rms = Math.sqrt(sum / data.length);
          const now = performance.now();

          if (rms > VAD_SPEECH_THRESHOLD) {
            lastVoiceAtRef.current = now;
            loudFramesRef.current += 1;
            if (!speakingRef.current) {
              speakingRef.current = true;
              speechStartRef.current = now;
              setIsSpeaking(true);
              perfReset();
              perf.speechStart = performance.now();
              console.log('[PERF] speech start');
              startRecording();
            }
          } else if (speakingRef.current) {
            const silentFor = now - lastVoiceAtRef.current;
            const spokeFor = now - speechStartRef.current;
            if (silentFor > VAD_SILENCE_MS) {
              speakingRef.current = false;
              setIsSpeaking(false);
              const keep = spokeFor >= VAD_MIN_SPEECH_MS
                        && loudFramesRef.current >= VAD_MIN_LOUD_FRAMES;
              if (keep) {
                committedRef.current = true;
                perf.silenceAt = performance.now() - VAD_SILENCE_MS;
                console.log('[PERF] silence detected — committing, loudFrames:', loudFramesRef.current, 'spokeFor:', spokeFor.toFixed(0) + 'ms');
              } else {
                console.log('[VAD] discarded — too short/quiet, loudFrames:', loudFramesRef.current, 'spokeFor:', spokeFor);
              }
              loudFramesRef.current = 0;
              stopRecording(keep);
            }
          }
        };
        tick();
      } catch (err) {
        console.error("Mic access error:", err);
        setSupported(false);
      }
    }

    function startRecording() {
      if (!streamRef.current) return;
      if (recorderRef.current && recorderRef.current.state === 'recording') return;
      try {
        const rec = new MediaRecorder(streamRef.current, { mimeType: 'audio/webm' });
        chunksRef.current = [];
        rec.ondataavailable = (e) => { if (e.data.size > 0) chunksRef.current.push(e.data); };
        rec.onstop = async () => {
          const discard = rec._discard === true;
          const blob = new Blob(chunksRef.current, { type: 'audio/webm' });
          chunksRef.current = [];
          if (discard || blob.size === 0) {
            console.log('[VAD] discarded utterance');
            committedRef.current = false;
            setIsTranscribing(false);
            return;
          }
          setIsTranscribing(true);
          try {
            const { text, noSpeechProb, avgLogprob } = await transcribeAudio(blob);
            const clean = (text || '').trim();
            console.log('[VAD] Whisper:', JSON.stringify(clean), 'no_speech:', noSpeechProb.toFixed(2), 'logprob:', avgLogprob.toFixed(2));
            const lowConfidence = noSpeechProb > WHISPER_NO_SPEECH_THRESHOLD || avgLogprob < WHISPER_LOGPROB_THRESHOLD;
            if (clean && !isHallucination(clean) && !lowConfidence && onUtteranceRef.current) {
              onUtteranceRef.current(clean);
            } else {
              const reason = !clean ? 'empty' : lowConfidence ? 'low-confidence' : 'hallucination';
              console.log('[VAD] rejected (' + reason + '):', JSON.stringify(clean));
              committedRef.current = false;
              if (onRejectedRef.current) onRejectedRef.current(reason);
            }
          } catch (err) {
            console.error("Whisper error:", err);
            committedRef.current = false;
            if (onRejectedRef.current) onRejectedRef.current('error');
          } finally {
            setIsTranscribing(false);
          }
        };
        recorderRef.current = rec;
        rec.start();
      } catch (e) {
        console.error('Recorder start error', e);
      }
    }

    function stopRecording(keep) {
      const rec = recorderRef.current;
      if (!rec || rec.state !== 'recording') return;
      rec._discard = !keep;
      try { rec.stop(); } catch (e) {}
    }

    start();

    return () => {
      cancelled = true;
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      if (recorderRef.current && recorderRef.current.state === 'recording') {
        recorderRef.current._discard = true;
        try { recorderRef.current.stop(); } catch (e) {}
      }
      if (audioCtxRef.current) { try { audioCtxRef.current.close(); } catch (e) {} }
      if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
      streamRef.current = null;
      setIsListening(false);
      setIsSpeaking(false);
    };
  }, [enabled]);

  return { isListening, isSpeaking, isTranscribing, supported };
}

const SYSTEM_PROMPT = `You are Kimberly, AI concierge at ${MALL_NAME}. There are 21 stalls.
IMPORTANT: Always recommend exactly ONE stall and ONE dish. Never suggest multiple stalls or multiple dishes. Pick the single best match for what the person wants.
When recommending, always mention the stall number (e.g. "Stall 5").
ALWAYS make a recommendation — never just ask a clarifying question. Even if the request is vague (e.g. "food stores", "what do you have"), pick your top recommendation and offer it.
For health-related requests (gastric, sore throat, flu, post-surgery), recommend light and gentle options like porridge (Stall 8), vegetarian (Stall 5), or soup (Stall 10/11). Avoid heavy or rich dishes like organ meats.
Halal rule: pork, lard, char siew, bak kut teh, bak chor mee, pig organ, roast pork, wanton (with pork), and alcohol are never halal. If the user asks for something contradictory like "halal pork", "halal bak kut teh", or "halal char siew", politely point out that pork is not halal and suggest a genuinely halal alternative (e.g. halal chicken rice at Stall 14, beef rendang at Stall 19, ayam penyet at Stall 20). Never pretend a non-halal dish is halal.
Be friendly, warm, and conversational. Always respond in 4-6 sentences — never fewer than 4.
Reply in plain text only. Do not use markdown, asterisks, bold, italics, bullet points, or any formatting symbols — the text is spoken aloud.
Here is the stall directory:\n` + BRANDS.map(b =>
  `Stall ${b.stall}: ${b.brand} (${b.cuisine})${b.halal ? ' [Halal]' : ''} - ${b.signature}. ${b.desc}`
).join('\n');

async function callGemini(conversationHistory) {
  const GEMINI_API_KEY = window.__CONFIG.GEMINI_API_KEY;
  const GEMINI_MODEL = window.__CONFIG.GEMINI_MODEL;
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`;

  const contents = conversationHistory.map(msg => ({
    role: msg.role === 'assistant' ? 'model' : 'user',
    parts: [{ text: msg.content }]
  }));

  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
      contents,
    })
  });

  if (!res.ok) throw new Error(`Gemini API error: ${res.status}`);
  const data = await res.json();
  const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Sorry, I could not generate a response.';
  return raw
    .replace(/\*\*(.*?)\*\*/g, '$1')
    .replace(/\*(.*?)\*/g, '$1')
    .replace(/_{1,2}(.*?)_{1,2}/g, '$1')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/^\s*[-*+]\s+/gm, '')
    .replace(/\s{2,}/g, ' ')
    .trim();
}

const SDK_READY = new Promise(resolve => {

async function createLiveAvatarSessionToken(avatarId, voiceId, contextId) {
  const API_KEY = window.__CONFIG.LIVEAVATAR_API_KEY;
  const res = await fetch('https://api.liveavatar.com/v1/sessions/token', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-API-KEY': API_KEY
    },
    body: JSON.stringify({
      avatar_id: avatarId,
      mode: 'FULL',
      is_sandbox: false,
      video_settings: { quality: 'high', encoding: 'H264' },
      avatar_persona: {
        voice_id: voiceId,
        first_message: "Hello! I'm Kimberly, your AI concierge here at Kopitiam, Tan Tock Seng Hospital. We have 21 food stalls with local favourites, halal options, and more. What are you in the mood for?",
        system_prompt: `You are Kimberly, AI concierge at Kopitiam in Tan Tock Seng Hospital. There are 21 food stalls.\nIMPORTANT: Always recommend exactly ONE stall and ONE dish. Never suggest multiple stalls.\nWhen recommending, always mention the stall number.\nALWAYS make a recommendation — never just ask clarifying questions.\nBe friendly, warm, and conversational. Respond in 4-6 sentences.\n\nHere is the stall directory:\nStall 1: Kaffe Toast (Western) - Toast bread sets with eggs and kaya\nStall 2: Toast Box (Western) - Thick toast with various toppings\nStall 3: Yaohan Kaya Toast (Singaporean) - Traditional kaya toast\nStall 4: Takahashi (Japanese) - Volcano chicken, stone bowls\nStall 5: Thoh @ The Pan (Indian) [Halal] - Prata, thosai, murtabak\nStall 6: Suntown Cafe (Western) - Chicken chop, steak, pasta\nStall 7: Wang Dae Bak (Korean) - BBQ pork, kimchi soup, army stew\nStall 8: Zhou's Kitchen (Chinese) - Porridge, Cantonese-style\nStall 9: Affordable Nasi Lemak (Malay) - Nasi lemak with sides\nStall 10: ILA [India] (Indian) [Halal] - Prata, briyani, Indian snacks\nStall 11: Malay Street (Malay) [Halal] - Nasi lemak, mee rebus\nStall 12: Hong Luo Chinese Pastry (Chinese) - Handmade buns, pau\nStall 13: Nature's Vitamin (Beverages) - Fresh juices, smoothies\nStall 14: Santiago (Western) [Halal] - Chicken rice, roasted meat\nStall 15: Monster Chili Mala Hot Pot (Chinese) [Halal] - Mala hotpot, customizable spice\nStall 16: Chef-on! (Western) [Halal] - Pasta, grill, zi char\nStall 17: Penang Kitchen (Peranakan) - Laksa, char kway teow\nStall 18: Superfish (Chinese) - Fish soup, sliced fish\nStall 19: Coastal Rhythm (Indonesian) [Halal] - Beef rendang, ayam penyet\nStall 20: Tsuru-Hashi (Japanese) - Donburi, udon, salmon\nStall 21: Qing Zun Ge (Chinese) - Herbal soup, vegetarian options`,
        context_id: contextId
      }
    })
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(`LiveAvatar session error: ${res.status} - ${err}`);
  }
  const data = await res.json();
  return data.data.session_token;
}

function App() {
  const [started, setStarted] = useState(false);
  const [messages, setMessages] = useState([]);
  const [loading, setLoading] = useState(false);
  const [speaking, setSpeaking] = useState(false);
  const [avatarConnected, setAvatarConnected] = useState(false);
  const [videoReady, setVideoReady] = useState(false);
  const [avatarStatus, setAvatarStatus] = useState("Initializing...");
  const [sdkUserSpeaking, setSdkUserSpeaking] = useState(false);
  const videoRef = useRef(null);
  const liveAvatarSessionRef = useRef(null);
  const chatEndRef = useRef(null);
  const userSpokeFirstRef = useRef(false);
  const lastAssistantText = useRef('');
  const sendToAgentRef = useRef(null);
  const messagesRef = useRef(messages);
  useEffect(() => { messagesRef.current = messages; }, [messages]);

  async function sendToAgent(text) {
    if (!text.trim()) return;
    setMessages(prev => [...prev, { role: 'user', content: text }]);
    setLoading(true);
    try {
      const history = [...messagesRef.current, { role: 'user', content: text }];
      const reply = await callGemini(history);
      setMessages(prev => [...prev, { role: 'assistant', content: reply }]);

      // Try to make LiveAvatar speak the response via data channel
      // SDK FULL mode handles responses automatically

      // Note: We rely on LiveAvatar to speak the response via data channel.
      // Browser TTS is disabled so the avatar uses its own voice.
      console.log('[LiveAvatar] Response sent; waiting for avatar to speak...');
    } catch (err) {
      console.error('Gemini error:', err);
      setMessages(prev => [...prev, { role: 'assistant', content: "Sorry, I couldn't process that." }]);
    } finally {
      setLoading(false);
    }
  }

  useEffect(() => { sendToAgentRef.current = sendToAgent; });

  const vadStreamRef = useRef(null);

  const { isListening, isSpeaking: userSpeaking, isTranscribing, supported } = useVoiceActivity({
    enabled: false, // SDK FULL mode handles mic/voice automatically
    paused: speaking || loading,
    onUtterance: (text) => sendToAgentRef.current && sendToAgentRef.current(text),
    onRejected: (reason) => console.log('[VAD] rejected:', reason),
    onStreamReady: (stream) => {
      vadStreamRef.current = stream;
      console.log('[VAD] Mic stream ready');
      // SDK handles its own mic via voiceChat.start(); don't publish VAD stream
    },
  });

  useEffect(() => {
    if (!userSpeaking) return;
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    if (speaking) setSpeaking(false);
  }, [userSpeaking, speaking]);

  const LIVEAVATAR_API_KEY = window.__CONFIG?.LIVEAVATAR_API_KEY;
  const LIVEAVATAR_AVATAR_ID = window.__CONFIG?.LIVEAVATAR_AVATAR_ID;
  const LIVEAVATAR_VOICE_ID = window.__CONFIG?.LIVEAVATAR_VOICE_ID;

  useEffect(() => {
    if (chatEndRef.current) chatEndRef.current.scrollIntoView({ behavior: "smooth" });
  }, [messages]);

  // Show all stalls on startup
  useEffect(() => {
    if (started) {
      setRecommendations(getFilteredBrands(activeFiltersRef.current));
    }
  }, [started]);

  // Connect LiveAvatar after user clicks Start
  useEffect(() => {
    if (!started) return;
    let cancelled = false;
    let session = null;

    async function connectLiveAvatar() {
      try {
        setAvatarStatus("Creating session...");
        console.log('[LiveAvatar] Creating session for avatar:', LIVEAVATAR_AVATAR_ID);

        await SDK_READY;
        const { LiveAvatarSession } = window.LiveAvatarSDK;

        const sessionToken = await createLiveAvatarSessionToken(
          LIVEAVATAR_AVATAR_ID,
          LIVEAVATAR_VOICE_ID,
          window.__CONFIG.LIVEAVATAR_CONTEXT_ID,
          activeFiltersRef.current
        );

        if (cancelled) return;

        session = new LiveAvatarSession(sessionToken, { voiceChat: true });
        liveAvatarSessionRef.current = session;
        console.log('[LiveAvatar] Session created');
        setAvatarStatus("Starting stream...");

        // Set up event listeners
        const { AgentEventsEnum, SessionEvent } = window.LiveAvatarSDK;

        session.on(SessionEvent.SESSION_STREAM_READY, () => {
          console.log('[LiveAvatar] Stream ready');
          if (videoRef.current) {
            session.attach(videoRef.current);
            videoRef.current.play().then(() => {
              setTimeout(() => { if (videoRef.current) videoRef.current.muted = false; }, 50);
            }).catch(e => console.log('[LiveAvatar] Play error:', e));
          }
          setVideoReady(true);
          setAvatarStatus("Connected! Speak to Kimberly...");
          setAvatarConnected(true);
        });

        session.on(AgentEventsEnum.AVATAR_SPEAK_STARTED, () => {
          console.log('[LiveAvatar] Avatar speak started');
          setSpeaking(true);
          setLoading(false);
          if (window._speakTimeout) clearTimeout(window._speakTimeout);
          window._speakTimeout = setTimeout(() => {
            console.log('[LiveAvatar] Safety: auto-reset speaking');
            setSpeaking(false);
          }, 30000);
        });

        session.on(AgentEventsEnum.AVATAR_TRANSCRIPTION_CHUNK, (e) => {
          if (!e.text || !e.text.trim()) return;
          setMessages(prev => {
            const last = prev[prev.length - 1];
            if (last && last.role === 'assistant') {
              return [...prev.slice(0, -1), { role: 'assistant', content: last.content + e.text }];
            }
            return [...prev, { role: 'assistant', content: e.text }];
          });
        });

        session.on(AgentEventsEnum.AVATAR_TRANSCRIPTION, (e) => {
          if (!e.text || !e.text.trim()) return;
          // Deduplicate: skip if exact same text was already shown
          if (e.text === lastAssistantText.current) {
            console.log('[LiveAvatar] Duplicate transcription skipped');
            return;
          }
          lastAssistantText.current = e.text;
          setMessages(prev => {
            const last = prev[prev.length - 1];
            if (last && last.role === 'assistant') {
              return [...prev.slice(0, -1), { role: 'assistant', content: e.text }];
            }
            return [...prev, { role: 'assistant', content: e.text }];
          });
        });

        session.on(AgentEventsEnum.AVATAR_SPEAK_ENDED, () => {
          console.log('[LiveAvatar] Avatar speak ended');
          if (window._speakTimeout) clearTimeout(window._speakTimeout);
          setSpeaking(false);
        });

        session.on(AgentEventsEnum.USER_TRANSCRIPTION, (e) => {
          console.log('[LiveAvatar] User said:', e.text);
          setMessages(prev => {
            const last = prev[prev.length - 1];
            if (last && last.role === 'user') {
              return [...prev.slice(0, -1), { role: 'user', content: e.text }];
            }
            return [...prev, { role: 'user', content: e.text }];
          });
        });

        session.on(AgentEventsEnum.USER_SPEAK_STARTED, () => {
          console.log('[LiveAvatar] User speak started');
          setSdkUserSpeaking(true);
        });

        session.on(AgentEventsEnum.USER_SPEAK_ENDED, () => {
          console.log('[LiveAvatar] User speak ended');
          setSdkUserSpeaking(false);
        });

        // Start the stream
        await session.start();

        if (cancelled) {
          session.stop();
          return;
        }

        console.log('[LiveAvatar] Stream started (voice chat auto-started by SDK)');

      } catch (err) {
        console.error("LiveAvatar connect error:", err);
        setAvatarStatus("Error: " + err.message);
      }
    }

    connectLiveAvatar();

    // Cleanup on unmount
    return () => {
      cancelled = true;
      if (session) {
        try { session.stop(); } catch (e) {}
      }
    };
  }, [started]);

  // ─── Start Screen ───
  if (!started) {
    return (
      <div style={{
        width: 2160, height: 3840, position: "relative", background: WHITE,
        display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",

              </div>
            ) : (
              <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "flex-start" }}>
                <div style={{ fontWeight: 600, fontSize: 30, color: RED, marginBottom: 8, marginLeft: 8 }}>Kimberly</div>
                <div style={{
                  background: "rgba(245, 177, 80, 0.6)",
                  borderRadius: "20px 20px 20px 4px",
                  padding: "24px 32px", maxWidth: "70%",
                  fontSize: 32, lineHeight: "42px",
                  color: "#000",
                }}>
                  {msg.content}
                </div>
              </div>
            )
          ))}

          {loading && (
            <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-start" }}>
              <div style={{ fontWeight: 600, fontSize: 30, color: RED, marginBottom: 8, marginLeft: 8 }}>Kimberly</div>
              <div style={{
                background: "rgba(245, 177, 80, 0.3)",
                borderRadius: "20px 20px 20px 4px",
                padding: "24px 32px",
                fontSize: 32, lineHeight: "42px", color: "#666",
              }}>
                <span style={{ animation: "pulse 1.5s infinite" }}>
                  Thinking...
                </span>
              </div>
            </div>
          )}

          <div ref={chatEndRef} />
        </div>
      </div>

      {/* ── Voice status indicator ── */}
      <div style={{
        position: "absolute", left: "50%", top: 1830,
        transform: "translateX(-50%)",
        display: "flex", flexDirection: "column", alignItems: "center", gap: 16,
      }}>
        <div style={{
          display: "flex", alignItems: "center", gap: 20,
          padding: "24px 48px", borderRadius: 60,
          background: WHITE,
          border: `4px solid ${speaking || loading ? "#ccc" : GOLD}`,
          boxShadow: "0 4px 20px rgba(0,0,0,0.08)",
          transition: "all 0.3s",
        }}>
          <div style={{
            width: 28, height: 28, borderRadius: "50%",
            background: (speaking || loading) ? "#ccc" : "#4CAF50",
          }} />
          <span style={{
            fontSize: 36, fontWeight: 600,
            color: (speaking || loading) ? "#888" : DARK_TEXT,
          }}>
            {speaking ? "Kimberly is speaking…"
              : loading ? "Thinking…"
              : sdkUserSpeaking ? "Hearing you…"
              : avatarConnected ? "Just speak — I'm listening"
              : "Connecting…"}
          </span>
        </div>
        {!avatarConnected && (
          <div style={{ color: "#888", fontSize: 28 }}>{avatarStatus}</div>
        )}
      </div>

      {/* ── Filter Bar ── */}
      <div style={{
        position: "absolute", left: 400, top: 370, width: 750,
        padding: "0",
        display: "flex", flexDirection: "column", gap: 12,
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 20, flexWrap: "wrap" }}>
          <span style={{ fontSize: 32, fontWeight: 600, color: DARK_TEXT }}>{activeFilters.language === 'zh' ? '筛选:' : 'Filters:'}</span>

          {/* Halal filter */}
          {[
            { key: "all", label: activeFilters.language === 'zh' ? '全部' : 'All' },
            { key: "halal", label: activeFilters.language === 'zh' ? '清真' : 'Halal' },
            { key: "non-halal", label: activeFilters.language === 'zh' ? '非清真' : 'Non-Halal' },
          ].map(opt => (
            <button key={opt.key} onClick={() => {
              const next = { ...activeFiltersRef.current, halal: opt.key };
              setActiveFilters(next);
              activeFiltersRef.current = next;
              const filtered = getFilteredBrands(next);
              const aiRecs = recommendations.filter(r => {
                const match = filtered.find(f => f.stall === r.stall);
                return !!match;
              });
              setRecommendations([...aiRecs, ...filtered.filter(f => !aiRecs.find(r => r.stall === f.stall))]);
            }} style={{
              padding: "12px 28px", borderRadius: 30, fontSize: 28, fontWeight: 600,
              border: `3px solid ${activeFilters.halal === opt.key ? RED : "#ccc"}`,
              background: activeFilters.halal === opt.key ? RED : WHITE,
              color: activeFilters.halal === opt.key ? WHITE : DARK_TEXT,
              cursor: "pointer", transition: "all 0.2s",
            }}>{opt.label}</button>
          ))}

          {/* Language toggle */}
          <div style={{ display: "flex", gap: 0, borderRadius: 30, overflow: "hidden", border: `3px solid ${RED}` }}>
            <button onClick={() => {
              const next = { ...activeFiltersRef.current, language: 'en' };
              setActiveFilters(next);
              activeFiltersRef.current = next;
            }} style={{
              padding: "12px 28px", fontSize: 28, fontWeight: 600,
              background: activeFilters.language === 'en' ? RED : WHITE,
              color: activeFilters.language === 'en' ? WHITE : DARK_TEXT,
              border: "none", cursor: "pointer",
            }}>English</button>
            <button onClick={() => {
              const next = { ...activeFiltersRef.current, language: 'zh' };
              setActiveFilters(next);
              activeFiltersRef.current = next;
            }} style={{
              padding: "12px 28px", fontSize: 28, fontWeight: 600,
              background: activeFilters.language === 'zh' ? RED : WHITE,
              color: activeFilters.language === 'zh' ? WHITE : DARK_TEXT,
              border: "none", borderLeft: `3px solid ${RED}`, cursor: "pointer",
            }}>中文</button>
          </div>

          {/* Reset filters */}
          {(activeFilters.halal !== "all" || activeFilters.language !== "en") && (
            <button onClick={() => {
              const next = { halal: "all", language: "en" };
              setActiveFilters(next);
              activeFiltersRef.current = next;
              const filtered = getFilteredBrands(next);
              setRecommendations(filtered);
            }} style={{
              padding: "12px 28px", borderRadius: 30, fontSize: 28, fontWeight: 600,
              border: "3px solid #888", background: "#f5f5f5", color: "#666",
              cursor: "pointer",
            }}>{activeFilters.language === 'zh' ? '重置' : 'Reset'}</button>
          )}
        </div>
      </div>

      {/* ── Kimberly's Recommendation ── */}
      {recommendations.length > 0 && (
        <div style={{
          position: "absolute", left: 0, top: 2150, width: 2160,
          padding: "0 80px",
        }}>
          <div style={{
            fontWeight: 600, fontSize: 48, color: RED, marginBottom: 30,
          }}>{activeFilters.language === 'zh' ? '美食摊位' : 'Food Stalls'}</div>

          <div style={{
            display: "flex", gap: 30, overflowX: "auto",
            paddingBottom: 20,
          }}>
            {recommendations.map((brand, i) => {
              const lastAssistantMsg = messages.filter(m => m.role === 'assistant').pop();
              const aiStalls = lastAssistantMsg ? extractRecommendations(lastAssistantMsg.content).map(b => b.stall) : [];
              const isAiPick = aiStalls.includes(brand.stall);
              return (
                <div key={i} style={{
                  minWidth: 580, background: WHITE,
                  borderRadius: 30, padding: "40px 36px",
                  boxShadow: "0 4px 30px rgba(0,0,0,0.1)",
                  border: `4px solid ${isAiPick ? GOLD : "#e0e0e0"}`,
                  flexShrink: 0,
                  position: "relative",
                }}>
                  {isAiPick && (
                    <div style={{
                      position: "absolute", top: -16, left: 24,
                      background: GOLD, color: DARK_TEXT,
                      fontSize: 22, fontWeight: 700,
                      padding: "6px 16px", borderRadius: 12,
                    }}>{activeFilters.language === 'zh' ? 'Kimberly推荐' : "Kimberly's Pick"}</div>
                  )}
                  <div style={{
                    display: "flex", justifyContent: "space-between", alignItems: "flex-start",
                    marginBottom: 16,
                  }}>
                    <div style={{
                      fontWeight: 700, fontSize: 38, color: DARK_TEXT,
                      lineHeight: "46px", flex: 1,
                    }}>{brand.brand}</div>
                    <div style={{ display: "flex", gap: 8 }}>
                      <div style={{
                        background: brand.halal ? "#2E7D32" : "#888",
                        color: WHITE, fontSize: 26, fontWeight: 600,
                        padding: "6px 18px", borderRadius: 20,
                        whiteSpace: "nowrap",
                      }}>{brand.halal ? "Halal" : "Non-Halal"}</div>
                    </div>
                  </div>
                  <div style={{
                    fontSize: 30, color: RED, fontWeight: 600, marginBottom: 12,
                  }}>Stall {brand.stall} · {brand.cuisine}</div>
                  <div style={{
                    fontSize: 30, color: "#666", fontWeight: 500, marginBottom: 12,
                  }}>★ {brand.signature}</div>
                  <div style={{
                    fontSize: 28, color: "#888", lineHeight: "38px",
                  }}>{brand.desc}</div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ── Bottom Sponsor Bar ── */}
      <div style={{
        position: "absolute", left: 0, top: 3454, width: 2160, height: 386,
      }}>
        <img src="assets/sponsor-bar.png" alt="Sponsors" style={{
          width: "100%", height: "100%", objectFit: "cover",
        }} onError={(e) => {
          e.target.outerHTML = '<div style="width:100%;height:100%;background:#f5f5f5;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:40px;">Sponsor Bar</div>';
        }} />
      </div>

      {/* ── Restart Button ── */}
      <button disabled={messages.length === 0 || speaking || loading} onClick={() => {
        setMessages([]);
        setLoading(false);
        setRecommendations([]);
        setFiltered(false);
        const resetFilters = { halal: "all", language: "en" };
        setActiveFilters(resetFilters);
        activeFiltersRef.current = resetFilters;
        userSpokeFirstRef.current = false;
      }} style={{
        position: "absolute", left: 80, top: 1891,
        transform: "translateY(-50%)",
        padding: "24px 48px",
        background: WHITE,
        border: "3px solid #ccc",
        borderRadius: 20,
        fontSize: 36, fontWeight: 500,
        color: DARK_TEXT,
        cursor: (messages.length === 0 || speaking || loading) ? "not-allowed" : "pointer",
        opacity: (messages.length === 0 || speaking || loading) ? 0.4 : 1,
        transition: "opacity 0.3s",
      }}>
        Restart Conversation
      </button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
