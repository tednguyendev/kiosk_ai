<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rec Card Test</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: #f5f5f5;
  padding: 100px;
}
.container {
  display: flex;
  gap: 30px;
  overflow-x: auto;
  padding-bottom: 20px;
}
.card {
  min-width: 580px;
  background: #fff;
  border-radius: 30px;
  padding: 32px 36px 40px;
  box-shadow: 0 4px 30px rgba(0,0,0,0.1);
  border: 4px solid #F5B150;
  flex-shrink: 0;
}
.badge {
  display: inline-block;
  background: #F5B150;
  color: #324157;
  font-size: 22px;
  font-weight: 700;
  padding: 6px 16px;
  border-radius: 12px;
  margin-bottom: 16px;
}
.brand-name {
  font-weight: 700;
  font-size: 38px;
  color: #324157;
  line-height: 46px;
  flex: 1;
}
.halal-badge {
  background: #2E7D32;
  color: #fff;
  font-size: 26px;
  font-weight: 600;
  padding: 6px 18px;
  border-radius: 20px;
  white-space: nowrap;
}
.stall-info {
  font-size: 30px;
  color: #CF463A;
  font-weight: 600;
  margin-bottom: 12px;
}
.signature {
  font-size: 30px;
  color: #666;
  font-weight: 500;
  margin-bottom: 12px;
}
.desc {
  font-size: 28px;
  color: #888;
  line-height: 38px;
}
</style>
</head>
<body>

<h1 style="margin-bottom: 40px; color: #CF463A;">Food Stalls</h1>

<div class="container">
  <div class="card">
    <div class="badge">Kimberly's Pick</div>
    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px;">
      <div class="brand-name">Monster Chili Mala Hot Pot</div>
      <div class="halal-badge">Halal</div>
    </div>
    <div class="stall-info">Stall 15 · Mala Hotpot</div>
    <div class="signature">★ Mala Hot Pot</div>
    <div class="desc">Singapore's first halal Mala hotpot (est. 2014). Own secret Mala Paste. Customizable spice levels. Also: Mala Soup, Malatang, Mala Noodle.</div>
  </div>
</div>

</body>
</html>
